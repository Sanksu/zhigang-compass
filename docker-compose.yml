# ──────────────────────────────────────────────────────────────
# 智岗罗盘 — Docker Compose 4 服务
# 使用: docker compose up -d
# 停止: docker compose down
# ──────────────────────────────────────────────────────────────

services:
  neo4j:
    image: neo4j:5
    container_name: zhigang-neo4j
    ports:
      - "7687:7687"   # Bolt
      - "7474:7474"   # Browser
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg15
    container_name: zhigang-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: zhigang
      POSTGRES_USER: zhigang
      POSTGRES_PASSWORD: zhigang
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhigang -d zhigang"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zhigang-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhigang-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      POSTGRES_DSN: postgresql+asyncpg://zhigang:zhigang@postgres:5432/zhigang
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./frontend/dist:/app/frontend-dist:ro

  # ARQ 异步任务 worker（BE-M3-04）：消费 resume_parse / run_etl_pipeline 等队列任务
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhigang-worker
    entrypoint: ["sh", "-c", "exec arq app.workers.tasks.WorkerSettings"]
    environment:
      APP_ENV: production
      POSTGRES_DSN: postgresql+asyncpg://zhigang:zhigang@postgres:5432/zhigang
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  pg_data:
  redis_data:
