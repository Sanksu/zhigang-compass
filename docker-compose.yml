# ──────────────────────────────────────────────────────────────
# 智岗罗盘 — Docker Compose 5 服务
# 使用: docker compose up -d
# 停止: docker compose down
# ──────────────────────────────────────────────────────────────

services:
  neo4j:
    image: neo4j:5
    container_name: zhigang-neo4j
    ports:
      - "7687:7687"   # Bolt
      - "7474:7474"   # Browser
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg15
    container_name: zhigang-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: zhigang
      POSTGRES_USER: zhigang
      POSTGRES_PASSWORD: zhigang
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhigang -d zhigang"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zhigang-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhigang-api
    ports:
      - "8000:8000"
    env_file:
      # SECRET_KEY / LLM_API_KEY 等项目敏感配置在 backend/.env（git 忽略），
      # 由 compose 注入容器；environment 块仅保留容器内联解析的地址类变量
      - ./backend/.env
    environment:
      APP_ENV: production
      POSTGRES_DSN: postgresql+asyncpg://zhigang:zhigang@postgres:5432/zhigang
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1  # 08-15 修复：env_file 的 ARQ_REDIS_URL=localhost 覆盖 ARQ 队列（容器内 localhost=自身），任务入队 Connection refused
      # 前端静态资源挂载点（backend/.env 的相对路径 ../frontend/dist 在容器内不成立）
      FRONTEND_DIST_DIR: /app/frontend-dist
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./frontend/dist:/app/frontend-dist:ro
      # JWT 签名密钥（backend/keys，.gitignore）：注入而非 COPY 进镜像，重建镜像不失效已有 token
      - ./backend/keys:/app/keys
      # SBERT 模型（backend/models/sbert）挂载进容器：镜像内无模型文件，
      # 不挂载时 SkillEmbedder 会尝试从 HuggingFace 下载（外网受限挂起）
      - ./backend/models:/app/models:ro
      # LLM provider 配置（08-15 恢复）：.gitignore 不入镜像（含 api_key），
      # 挂载宿主机文件——可写（管理后台 /admin/llm 写回持久化）
      - ./backend/configs/llm_providers.yaml:/app/configs/llm_providers.yaml
      # 运行时配置（08-16 管理后台 /admin/settings 可写；api/worker 共享宿主文件，重启后生效）
      - ./backend/configs/runtime_settings.json:/app/configs/runtime_settings.json
      # dict-guard 动态过滤层（第五轮审查 P1-1 修复）：worker 每日评估 auto 拦截与
      # 管理端审批写入、api 的 is_noise_skill 热路径读取——此前未挂载，跨容器互不可见；
      # 宿主文件须先于 compose up 创建（见 DEPLOY.md），缺失时 Docker 会建同名目录
      - ./backend/configs/skill_filters_dynamic.json:/app/configs/skill_filters_dynamic.json
      # 爬虫输出目录（08-15 修复：累计采集量统计读 /app/data/crawlers/output，
      # 此前 api 容器无挂载——容器内为空目录，爬取管理页累计采集量恒 0；
      # worker 侧已有同款挂载，双向读写一致）
      - ./backend/data/crawlers/output:/app/data/crawlers/output
      # 上传文件共享卷（08-15 修复）：resume_parse 任务在 worker 容器读 /app/uploads——
      # 此前 api 落盘 worker 读不到，任务 failed「文件不存在」
      - uploads_data:/app/uploads
      # 报告目录（08-18 压测核验）：freshness/diversity 等报告落容器内 /app/reports，
      # 无挂载则容器重建即丢失——与宿主机 backend/reports 共享持久化
      - ./backend/reports:/app/reports
    restart: unless-stopped  # 08-18 观察：api 曾因引擎/资源事件被优雅停止且无重启策略而宕机，与 worker 对齐

  # ARQ 异步任务 worker（BE-M3-04）：消费 resume_parse / run_etl_pipeline 等队列任务
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhigang-worker
    entrypoint: ["sh", "-c", "exec arq app.workers.settings.WorkerSettings"]
    # 与 api 同源注入 backend/.env（SECRET_KEY / LLM_API_KEY 等），
    # environment 内联项会覆盖 env_file 同名变量
    env_file:
      - ./backend/.env
    # 覆盖 Dockerfile 中 API 的 healthcheck（worker 无 HTTP 端口，且
    # slim 镜像无 pgrep），改为检查容器主进程（exec 后的 arq worker）存活
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      APP_ENV: production
      POSTGRES_DSN: postgresql+asyncpg://zhigang:zhigang@postgres:5432/zhigang
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      # 国际源走系统代理（与本地爬虫一致，国内源不设即直连）。
      # 08-14 修复：容器内 127.0.0.1 指向容器自身——默认代理须走
      # host.docker.internal 指向宿主机 Clash（否则国际源连接被拒，
      # 实测 arxiv/github/stackoverflow 产出 0 条）；宿主机显式设置
      # HTTPS_PROXY 时优先（可覆盖）。
      # 08-23 修复：`:-` 对空值也回退默认——LAN/无 Clash 部署无法经 .env
      # 关闭代理（Linux Docker 不解析 host.docker.internal → 全部请求
      # DNS 失败，226 实证）。改用 `-`（仅未设置时取默认）：.env 写
      # `HTTPS_PROXY=`（空值）即关闭，国内源直连、国际源尽力直连。
      HTTPS_PROXY: ${HTTPS_PROXY-http://host.docker.internal:7890}
      HTTP_PROXY: ${HTTP_PROXY-http://host.docker.internal:7890}
      # 08-16 修复：CDP 就绪探测（urllib 访问 127.0.0.1:922x）必须绕过代理——
      # 未设 NO_PROXY 时探测被路由到宿主机 Clash（CONNECT 宿主机自身端口）返回 502，
      # ensure_cdp_chrome 恒失败 → maimai/boss/glassdoor 等 CDP 爬虫全部 0 产出
      NO_PROXY: "127.0.0.1,localhost"
      no_proxy: "127.0.0.1,localhost"
      # 容器无显示服务器：CDP 浏览器以无头模式运行（本地桌面保持有头以完成登录/验证）
      CDP_HEADLESS: "1"
      # CDP 浏览器代理（glassdoor 等国际源）：容器内经 host.docker.internal 指向宿主机 Clash；
      # `.env` 置空（CDP_PROXY=）即关闭——setup_boss_chrome 仅非空时注入 --proxy-server
      CDP_PROXY: ${CDP_PROXY-http://host.docker.internal:7890}
      # boss 登录态文件（宿主机经 export-cookies 导出；采集从文件读 cookies，无浏览器依赖）
      BOSS_COOKIES_FILE: /home/app/.zhigang-compass/boss-cookies.json
      # 可选 GitHub API token（提升无 token 的 10 req/min 按 IP 限流配额，消除二次限制）；
      # 未配置时 github 爬虫维持匿名采集（偶发 403 由 BackoffRetryMiddleware 退避重试兜底）
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      # JWT 密钥（与 api 同款挂载，对称校验/续签任务用）
      - ./backend/keys:/app/keys
      # SBERT 模型（与 api 同款挂载）：worker 的匹配/嵌入链路需加载模型——
      # 无挂载时容器层无模型，无代理环境从 HuggingFace 下载挂起（08-23 226 实证）
      - ./backend/models:/app/models:ro
      # 爬虫输出持久化：容器重建不丢 JSONL
      - ./backend/data/crawlers/output:/app/data/crawlers/output
      # boss 登录态文件（导出: cd backend/data/crawlers && python boss_cdp_crawler.py --export-cookies ~/.zhigang-compass/boss-cookies.json）
      - ${USERPROFILE:-~}/.zhigang-compass/boss-cookies.json:/home/app/.zhigang-compass/boss-cookies.json
      # 上传文件共享卷（08-15 修复：resume_parse 任务在 worker 容器读 /app/uploads）
      - uploads_data:/app/uploads
      # LLM provider 配置（08-15 恢复）：与 api 同款挂载，worker 的
      # enrich_course_skills/爬虫登录后处理等 LLM 链路共用
      - ./backend/configs/llm_providers.yaml:/app/configs/llm_providers.yaml
      # 运行时配置（08-16 管理后台 /admin/settings 可写；api/worker 共享宿主文件，重启后生效）
      - ./backend/configs/runtime_settings.json:/app/configs/runtime_settings.json
      # dict-guard 动态过滤层（第五轮审查 P1-1 修复）：与 api 同款挂载，ETL 阶段16
      # auto 拦截写入后 api ≤30s 热感知——此前未挂载，auto 档在标准部署下断链
      - ./backend/configs/skill_filters_dynamic.json:/app/configs/skill_filters_dynamic.json
      # 报告目录（08-18 压测核验）：与 api 同款挂载，容器重建不丢 freshness/diversity 报告
      - ./backend/reports:/app/reports
      # SBERT 模型（与 api 同款挂载）：匹配引擎在 worker 侧执行（match_recommend），
      # 镜像内无模型文件——不挂载时 SkillEmbedder 尝试从 HuggingFace 下载，
      # 无代理环境（08-23 226 部署实证）直接卡死匹配任务
      - ./backend/models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  pg_data:
  redis_data:
  uploads_data: