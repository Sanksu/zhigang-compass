name: CI Frontend

# 全量触发（无 paths 过滤）：分支保护将本 workflow 设为 develop 必过 check，
# 若按 frontend/** 过滤，backend-only PR 永不触发本 workflow → 保护死锁
# 无法合并（2026-08-16 重复岗位治理 PR #260 首次触发，临时放宽保护后修复）
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        # 不用 --frozen-lockfile: lockfile 由旧版 pnpm 生成, 与 pnpm 10+ 的
        # ignoredOptionalDependencies/onlyBuiltDependencies settings 校验不兼容
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
