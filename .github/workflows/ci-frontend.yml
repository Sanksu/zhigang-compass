name: CI Frontend

# 全量触发（无 paths 过滤）：分支保护将本 workflow 设为 develop 必过 check，
# 若按 frontend/** 过滤，backend-only PR 永不触发本 workflow → 保护死锁
# 无法合并（2026-08-16 重复岗位治理 PR #260 首次触发，临时放宽保护后修复）
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        # 不用 --frozen-lockfile: lockfile 由旧版 pnpm 生成, 与 pnpm 10+ 的
        # ignoredOptionalDependencies/onlyBuiltDependencies settings 校验不兼容
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # 无基础设施 E2E（mock API，浏览器层 page.route 拦截 /api/v1，无需 docker/后端）：
  # L0-2 新增。非必过 check（未加入分支保护 required checks）——持续产生信号，
  # 如需收为合并门禁，加进 develop 保护的 required_status_checks 即可。
  e2e-mock:
    name: E2E (mock API)
    runs-on: ubuntu-latest
    # 首次运行须下载 Playwright 浏览器（已加缓存，后续同 lockfile 快速），
    # 10min 曾超时被取消；20min 预留安装/下载抖动余量
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (mock API)
        run: pnpm e2e:ci
