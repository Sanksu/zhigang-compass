name: CI Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Install + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        env:
          APP_ENV: test
        # pytest 返回码 5 = 未收集到测试用例（允许通过），其余失败置红（不再 continue-on-error）
        run: |
          uv run pytest -q --cov=app --cov-report=term-missing
          rc=$?
          if [ $rc -eq 5 ]; then exit 0; fi
          exit $rc

      - name: Import smoke check
        # 验证核心模块可正常 import（捕获循环依赖、缺失依赖等）
        run: uv run python -c "from app.main import app; print('app import OK')"
