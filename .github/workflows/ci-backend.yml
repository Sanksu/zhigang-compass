name: CI Backend

# 全量触发（无 paths 过滤）：分支保护将本 workflow 设为 develop 必过 check，
# 若按 backend/** 过滤，docs-only PR 永不触发本 workflow → 保护死锁无法合并
# （2026-08-16 与 ci-frontend.yml 同步修复）
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Install + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Run tests
        env:
          APP_ENV: test
        # 覆盖率门禁：--cov=app 启用测量，fail_under=60 阈值由 pyproject.toml
        # [tool.coverage.report] 声明式配置（设计文档 §15.3 验收 ≥60%）；
        # 返回码 5 = 未收集到测试用例（允许通过），其余失败置红
        run: |
          uv run pytest -q --cov=app --cov-report=term-missing
          rc=$?
          if [ $rc -eq 5 ]; then exit 0; fi
          exit $rc

      - name: Import smoke check
        # 验证核心模块可正常 import（捕获循环依赖、缺失依赖等）
        run: uv run python -c "from app.main import app; print('app import OK')"
