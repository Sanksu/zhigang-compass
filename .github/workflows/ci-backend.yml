name: CI Backend

# 全量触发（无 paths 过滤）：分支保护将本 workflow 设为 develop 必过 check，
# 若按 backend/** 过滤，docs-only PR 永不触发本 workflow → 保护死锁无法合并
# （2026-08-16 与 ci-frontend.yml 同步修复）
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Install + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Run tests
        env:
          APP_ENV: test
        # 覆盖率门禁：--cov=app 启用测量，fail_under=60 阈值由 pyproject.toml
        # [tool.coverage.report] 声明式配置（设计文档 §15.3 验收 ≥60%）。
        # L-16：返回码 5（未收集到测试用例）同样置红——collection 清空（如
        # conftest 报错、marker 误排除全部用例）曾是假绿通道
        run: uv run pytest -q --cov=app --cov-report=term-missing

      - name: Import smoke check
        # 验证核心模块可正常 import（捕获循环依赖、缺失依赖等）
        run: uv run python -c "from app.main import app; print('app import OK')"

  # 契约同步校验（铁律一执行点，第六轮审查）：openapi.yaml 变更必须同步再生成
  # 前端 api.d.ts——漂移即置红（前端由 ci-frontend tsc 兜底，本 job 显式门禁）
  contract:
    name: Contract sync (openapi → api.d.ts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable
      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Regen types and verify zero drift
        working-directory: frontend
        run: |
          pnpm gen:api
          git diff --exit-code -- src/types/api.d.ts || {
            echo '┌────────────────────────────────────────────────┐'
            echo '│ 契约漂移：openapi.yaml 已变、api.d.ts 未同步  │'
            echo '│ 请运行 pnpm gen:api 并随本 PR 一并提交        │'
            echo '└────────────────────────────────────────────────┘'
            exit 1
          }
