# ──────────────────────────────────────────────────────────────
# CD — develop 合并后自动构建并发布后端镜像到 GHCR
# 目的（2026-08-22 第五轮评审 P0 落地）：
#   1. 「合并 ≠ 部署」的可部署性门禁：develop 上的 Dockerfile/依赖破损
#      在此即刻暴露，而不是等部署当日才发现（08-22 教训：修复合并后
#      镜像滞后，运行栈仍跑旧代码）；
#   2. 产出可 pull 的预构建镜像（compose 本地 build 仍是默认部署路径，
#      GHCR 仅供加速/应急，见 DEPLOY.md §3.1）。
# 非必过检查（不在分支保护 required contexts 中，不阻塞 PR 合并）。
# 首次运行因 torch 等重型依赖下载较慢（约 15-30min），此后 GHA layer
# cache 命中，仅 COPY 层随代码变化，分钟级完成。
# ──────────────────────────────────────────────────────────────
name: CD (images)

on:
  push:
    branches: [develop]
    paths:
      - backend/**
      - .github/workflows/cd-images.yml
  workflow_dispatch: {}

# 多个 PR 连续合入 develop 时只允许最新提交发布 :develop 标签；否则旧 run
# 可能晚于新 run 完成并把浮动标签回退到旧镜像。
concurrency:
  group: cd-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & Push api/worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # api 与 worker 共用同一 Dockerfile（仅 entrypoint 不同），构建一次双别名推送
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/sanksu/zhigang-compass-api:develop
            ghcr.io/sanksu/zhigang-compass-api:sha-${{ github.sha }}
            ghcr.io/sanksu/zhigang-compass-worker:develop
            ghcr.io/sanksu/zhigang-compass-worker:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
