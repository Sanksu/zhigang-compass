# Alembic 迁移配置
[alembic]
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://zhigang:zhigang@localhost:5432/zhigang
# 将项目根（backend/）加入 sys.path，保证 env.py 内 `from app.xxx` 可导入
# （容器内直接执行 alembic，无 `uv run` 注入项目根）
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
