[project]
name = "zhigang-compass"
version = "0.1.0"
description = "智岗罗盘——多源异构驱动的岗位能力动态演化与人岗匹配系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.2",
    "neo4j>=5.20",
    "redis>=5.0",
    "httpx>=0.27",
    "arq>=0.26",
    "pyjwt[crypto]>=2.8",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "instructor>=1.0",
    "openai>=1.0",
    "sentence-transformers>=3.0",
    # ── 爬虫管线 ──
    "scrapy>=2.11",
    "scrapy-playwright>=0.0.40",
    "playwright>=1.40",
    "python-jobspy>=1.1.82",
    "pdfplumber>=0.11",
    "python-docx>=1.2.0",
    "paddlepaddle>=2.6",
    "paddlex[ocr-core]>=3.0",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "psycopg2-binary>=2.9.12",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "anthropic>=1.2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pypdf>=6.14.2",
    "locust>=2.0",
    "optuna>=4.0",
    "ruff>=0.9",
    "openpyxl>=3.1",
]

# ── 代码质量（CI 门禁：uv run ruff check）──
[tool.ruff]
line-length = 120
# 归档目录（scripts/archive/）为历史一次性脚本留档，退出 lint
exclude = ["scripts/archive"]
# 仅启用正确性类规则（pyflakes F + pycodestyle 子集 + 未使用变量），
# 不含风格类（E501 行宽）与自动格式化，避免与既有代码风格冲突
lint.select = ["F", "E401", "E402"]

[tool.ruff.lint.per-file-ignores]
# 测试/脚本允许部分导入顺序问题
"tests/**" = ["E402"]
"scripts/**" = ["E402"]

# ── 单元测试框架（TE-M3-01）──
# 验收：后端单元测试覆盖 ≥ 60%（核心 ≥ 80%），见设计文档。
# 覆盖率门禁在 CI 显式启用（uv run pytest -q --cov=app），本地局部跑单文件不触发
# fail_under，避免被覆盖率拖累；fail_under 阈值仍声明式收敛在 [tool.coverage.report]。
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    # M1 修复:marker 语义从"真实 LLM API"扩为"需外部基础设施或真实 LLM API",
    # 覆盖 tests/integration/ 目录下依赖 docker-compose(Neo4j/PG/Redis)的端到端
    # 用例——本地 docker 在跑时普通 pytest 会拉起这些用例,且数据演化后断言易脆,
    # 一并默认排除,需显式 -m integration 执行
    "integration: 集成测试（需 docker-compose 基础设施或真实 LLM API；默认不跑，显式 -m integration 执行）",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70  # 第六轮审查：实际 77.57%，60 已虚低

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
