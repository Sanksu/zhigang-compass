[project]
name = "zhigang-compass"
version = "0.1.0"
description = "智岗罗盘——多源异构驱动的岗位能力动态演化与人岗匹配系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.2",
    "neo4j>=5.20",
    "redis>=5.0",
    "httpx>=0.27",
    "arq>=0.26",
    "pyjwt[crypto]>=2.8",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "instructor>=1.0",
    "openai>=1.0",
    "sentence-transformers>=3.0",
    # ── 爬虫管线 ──
    "scrapy>=2.11",
    "scrapy-playwright>=0.0.40",
    "playwright>=1.40",
    "python-jobspy>=1.1.82",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "locust>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
