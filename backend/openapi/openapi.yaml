                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/EtlTaskStatus'
                  trace_id: { type: string }
        '404':
          description: 任务不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

