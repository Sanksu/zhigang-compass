        page: { type: integer }
        size: { type: integer }

    EvolutionDiffNode:
      type: object
      description: 版本 Diff 节点项
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }

    EvolutionDiff:
      type: object
      description: 两个版本快照 Diff（GET /evolution/diff）
      required: [nodes_added, nodes_removed, nodes_changed, edges_added, edges_removed]
      properties:
        nodes_added:
          type: array
