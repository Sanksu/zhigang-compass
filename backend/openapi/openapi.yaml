    RuntimeConfig:
      type: object
      description: 运行时配置（GET/PUT /admin/runtime-config，重启后生效）
      properties:
        arq_concurrency: { type: integer, description: ARQ 任务并发数（1-100） }
        arq_job_timeout: { type: integer, description: ARQ 任务超时秒（60-86400） }
        alert_webhook_url: { type: string, description: 告警 webhook（空=不告警） }
        evolution_cache_ttl: { type: integer, description: 演化列表缓存 TTL 秒（5-3600） }
        crawl_items_cap: { type: integer, description: 爬虫单次采集条数上限（10-1000） }
        rate_limit:
          type: object
          description: 爬虫限频（source → {req_per_min, delay_range:[min,max] 秒}）
          additionalProperties:
            type: object
            properties:
              req_per_min: { type: integer, description: 每分钟请求数（1-600） }
              delay_range:
                type: array
                items: { type: integer }
                minItems: 2
                maxItems: 2
                description: 请求间隔 [min, max] 秒（1-300）
        # ── ETL 队列（08-21 配置中心新增）──
        etl_batch_cap: { type: integer, description: ETL 批次上限（积压缩放封顶，100-5000） }
        etl_structure_load_default: { type: integer, description: 结构化加载默认批次（100-1000） }
        etl_validate_temporal_default: { type: integer, description: 时滞/通胀检测默认批次（100-500） }
        etl_run_hour: { type: integer, description: ETL 调度小时（0-23，容器内 ARQ cron） }
        etl_run_minute: { type: integer, description: ETL 调度分钟（0-59） }
        # ── 每爬虫采集配置（08-21：开关 + 采集数量；08-21b：独立触发时间）──
        crawlers:
          type: object
          description: 每爬虫采集配置（spider → {enabled, max_results, max_empty_retries, hour, minute}）；缺省启用、按源默认数量
          additionalProperties:
            type: object
            properties:
              enabled: { type: boolean, description: 是否参与 ETL 调度（false=停用） }
              max_results: { type: integer, description: 单次采集条数上限（仅 arxiv/zhilian 消费；10-1000） }
              max_empty_retries: { type: integer, description: 页面级空列表退避重试次数（0=关闭，1-10；zhilian 消费，默认 3） }
              hour: { type: integer, description: 独立触发小时（0-23；配置后该爬虫单独 cron 触发，缺省并入主管线） }
              minute: { type: integer, description: 独立触发分钟（0-59；与 hour 成对） }

    LlmProviderConfig:
      type: object
      description: LLM provider 配置项（GET/PUT /admin/llm-config）
      required: [name, priority, base_url, model, enabled]
      properties:
        name: { type: string, description: provider 唯一名（字母/数字/下划线/短横线） }
        priority: { type: integer, description: 尝试优先级（1 最高，唯一） }
        base_url: { type: string }
        api_key: { type: string, description: 回显时打码（*）；提交空白/含掩码保持原值 }
        model: { type: string }
        supports_function_calling: { type: boolean }
        enabled: { type: boolean }
        extra_body:
          type: object
          description: provider 特定请求参数（如 deepseek 关闭思考模式），编辑时须保留

    LlmConfig:
      type: object
      description: GET/PUT /admin/llm-config 响应/请求 data
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/LlmProviderConfig' }

    # ============================================================
    # 演化模块端点 data（08-14 契约补全：versions/diff/trends/signals/state-machine/watch）
    # ============================================================

    EvolutionVersion:
