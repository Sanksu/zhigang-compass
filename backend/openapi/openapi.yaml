      type: object
      description: |
        数据血缘链中的单条来源 JD 记录（岗位 ← 证据 JD ← 采集源）。
        溯源方向：图谱岗位/技能声明 ← 抽取证据（extraction）← 原始 JD 记录
        （jd_raw，含 source / source_url / crawled_at）。
      required: [jd_id, source]
      properties:
        jd_id: { type: integer, description: jd_raw 记录 id }
        source: { type: string, description: 采集源（boss/zhilian/indeed/glassdoor...） }
        source_url: { type: string, description: 原始 JD URL（溯源跳转） }
        crawled_at: { type: string, description: 采集时间 ISO8601 }
        city: { type: string, description: 城市（location 提取） }
        salary: { type: string, description: 原始薪资文本 }
        skills:
          type: array
          items: { type: string }
          description: 抽取技能名
        is_duplicate:
          type: boolean
          description: SimHash 跨源去重标记（被标记记录不参与图谱聚合）

    LineagePositionItem:
      type: object
      description: |
        单个岗位的数据血缘溯源详情（列表项：跨源校验汇总，不含证据 JD 明细）。
        与 ETL cross_validate_jds 同口径，按归一化岗位名分组。
      required: [position_name, jd_count, source_count, verified, confidence, verified_skill_ratio, experience_divergence]
      properties:
        position_name: { type: string, description: 归一化岗位名（组标识） }
        jd_count: { type: integer, description: 组内 JD 条数 }
        source_count: { type: integer, description: 独立数据源数 }
        sources:
          type: array
          items: { type: string }
          description: 来源列表（去重）
        cities:
          type: array
          items: { type: string }
          description: 组内城市集合
        verified: { type: boolean, description: ≥2 独立源印证（技能级跨源验证通过） }
        confidence: { type: number, format: float, description: 跨源置信度（0-1） }
        verified_skill_ratio:
          type: number
          format: float
          description: ≥2 源技能占比（跨源一致性）
        unverified_skills:
          type: array
          items: { type: string }
          description: 单源技能（未达 2 源印证，待人工审核）
        salary_median:
          type: number
          format: float
          nullable: true
          description: 同岗位月薪中位数（元/月，跨城市平滑后市场口径）
        salary_outlier:
          type: boolean
          description: 多平台薪资中位数差异 >50%
        experience_divergence:
          type: number
          format: float
          description: 经验要求跨平台分歧度（0-1，1=完全分歧）

