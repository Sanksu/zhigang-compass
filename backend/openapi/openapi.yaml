  # ============================================================
  # 匹配模块 /api/v1/match
  # ============================================================
  /api/v1/match/recommend:
    post:
      tags: [match]
      summary: 自动推荐 Top-N（异步，ARQ 队列 + 含 CII 通胀修正）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_id]
              properties:
                resume_id: { type: string }
                top_n: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '202':
          description: 任务已入队，返回 task_id（轮询 /match/task/{task_id} 获取进度与结果）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/RecommendTaskResult'
                  trace_id: { type: string }
        '422':
          description: resume_id 格式非法（code 4000）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '403':
          description: 非本人无权使用该简历发起匹配
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: 简历不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/v1/match/compare:
    post:
      tags: [match]
      summary: 人岗比对（含差距三态 + 学习路径）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_id, position_id]
              properties:
                resume_id: { type: string }
                position_id: { type: string }
      responses:
        '200':
          description: |
            匹配结果 + gaps（GapSkill[]，三态）+ learning_path
            （LearningPathItem[]，missing/weak 技能先修链 + 课程 Top-3）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/MatchResult'
                  trace_id: { type: string }
  /api/v1/match/task/{task_id}:
    get:
      tags: [match]
      summary: 查询推荐任务状态
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/MatchTaskStatus'
                  trace_id: { type: string }
  /api/v1/match/result/{match_id}:
    get:
      tags: [match]
      summary: 获取匹配结果
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 匹配详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/MatchResultList'
                  trace_id: { type: string }
  /api/v1/match/result/{match_id}/gap:
    get:
      tags: [match]
      summary: 获取差距分析
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 差距列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/MatchGapData'
                  trace_id: { type: string }
  /api/v1/match/result/{match_id}/path:
    get:
      tags: [match]
      summary: 获取学习路径
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 学习路径
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/MatchPathData'
                  trace_id: { type: string }
  /api/v1/match/result/{match_id}/diagnosis:
    post:
      tags: [match]
      summary: 异步生成或复用人岗比对诊断报告
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: 诊断任务已创建或复用
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/DiagnosisTaskResponse'
                  trace_id: { type: string }
        '422':
          description: 该匹配结果无差距数据（code 4000）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: 匹配结果不存在或无权访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    get:
      tags: [match]
      summary: 获取人岗比对诊断报告（只读）
      description: >
        读取已生成的诊断报告：24h Redis 缓存优先，过期后从 PostgreSQL
        DiagnosisReportRecord 耐久记录回读并回填缓存。生成一律走 POST
        异步任务（worker 唯一执行路径），本端点不再同步调用 LLM；
        缓存与落库皆无时返回 404，客户端应先 POST 创建生成任务。
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 诊断报告（overall_summary / radar_analysis / top_gaps / path_analysis / recommendations）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/DiagnosisReport'
                  trace_id: { type: string }
        '422':
          description: 该匹配结果无差距数据（仅人岗比对可生成诊断报告，code 4000）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: 匹配结果不存在或已过期；或诊断报告尚未生成（需先 POST 创建生成任务）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/match/feedback:
    post:
      tags: [match]
      summary: 提交匹配反馈
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [match_id, score]
              properties:
                match_id: { type: string }
                score: { type: integer, enum: [1, -1], description: "1=👍, -1=👎" }
      responses:
        '200':
          description: 反馈已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

