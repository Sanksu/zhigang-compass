  /api/v1/match/result/{match_id}/diagnosis:
    post:
      tags: [match]
      summary: 异步生成或复用人岗比对诊断报告
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: 诊断任务已创建或复用
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/DiagnosisTaskResponse'
                  trace_id: { type: string }
        '400':
          description: 该匹配结果无差距数据
        '404':
          description: 匹配结果不存在或无权访问
    get:
      tags: [match]
      summary: 获取人岗比对诊断报告（兼容同步生成）
      description: LLM 基于结果快照（分数/差距/学习路径/证据）生成结构化诊断报告，结果缓存 24h
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 诊断报告（overall_summary / radar_analysis / top_gaps / path_analysis / recommendations）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/DiagnosisReport'
                  trace_id: { type: string }
        '400':
          description: 该匹配结果无差距数据（仅人岗比对可生成诊断报告）
        '404':
          description: 匹配结果不存在或已过期
        '503':
          description: 诊断报告生成失败（LLM 未配置可用 provider 或全部 provider 调用失败，错误码 503）
        '504':
          description: LLM 调用超时（错误码 5003，前端可据此提示稍后重试）

