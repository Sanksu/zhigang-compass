openapi: 3.1.0
info:
  title: 智岗罗盘 API
  version: 1.0.0
  description: |
    多源异构驱动的岗位能力动态演化与人岗匹配系统 API 契约。
    本文件是前后端并行开发的单一事实源（AGENTS.md 铁律一）。
    前端通过 `openapi-typescript` 生成类型，不得自行定义与后端不一致的类型。
    认证方案：Bearer 双 Token（access 30min / refresh 7d）；refresh_token 同时
    写入 httpOnly Cookie（httponly + samesite=lax），供页面刷新后静默恢复会话。
    标注规则：全部端点已实现（M1-M4 全量交付），契约不含里程碑占位标注。
  contact:
    name: 智岗罗盘团队
    url: https://github.com/zhigang-compass

servers:
  - url: http://localhost:8000
    description: 开发环境
  - url: https://api.zhigang.example.com
    description: 生产环境

security:
  - BearerAuth: []

tags:
  - name: auth
    description: 认证模块
  - name: graph
    description: 图谱模块
  - name: resume
    description: 简历模块
  - name: match
    description: 匹配模块
  - name: evolution
    description: 演化模块
  - name: admin
    description: 管理模块

paths:
  # ============================================================
  # 认证模块 /api/v1/auth
  # ============================================================
  /api/v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录获取双 Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功，返回双 Token（Bearer 方案，前端内存持有）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/LoginResult'
                  trace_id: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      summary: 刷新 access_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/LoginResult'
                  trace_id: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      security: []
      summary: 登出，refresh_token 加入黑名单（body 传 refresh_token）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/auth/me:
    get:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      summary: 获取当前用户信息
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    put:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      summary: 更新当前用户资料（email/phone/bio，None 字段保留原值）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, maxLength: 255 }
                phone: { type: string, maxLength: 50 }
                bio: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: 更新后的用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/User'

  /api/v1/auth/password:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      summary: 修改当前用户密码（校验原密码，新密码不得与旧密码相同）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password, minLength: 6, maxLength: 256 }
                new_password: { type: string, format: password, minLength: 6, maxLength: 256 }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      updated: { type: boolean }

  /api/v1/auth/register:
    post:
      tags: [auth]
      security: []
      summary: 注册新用户（默认 guest 角色；管理员建号走 /admin/users）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================
  # 图谱模块 /api/v1/graph
  # ============================================================
  /api/v1/graph/position/{id}:
    get:
      tags: [graph]
      security: []
      summary: 岗位节点详情
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 岗位详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/PositionDetail'
                  trace_id: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/graph/position/{id}/skills:
    get:
      tags: [graph]
      security: []
      summary: 岗位技能列表
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: necessity
          in: query
          schema: { type: string, enum: [must, nice] }
      responses:
        '200':
          description: 技能列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/PositionSkillsData'
                  trace_id: { type: string }

  /api/v1/graph/skill/{id}:
    get:
      tags: [graph]
      security: []
      summary: 技能节点详情
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 技能详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/SkillDetail'
                  trace_id: { type: string }

  /api/v1/graph/skill/{id}/evidence:
    get:
      tags: [graph]
      security: []
      summary: 技能证据列表
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 证据列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/SkillEvidenceData'
                  trace_id: { type: string }

  /api/v1/graph/skill/{id}/prerequisites:
    get:
      tags: [graph]
      security: []
      summary: 技能先修技能链（图谱 PREREQUISITE_OF 优先，先修字典回退）
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 先修链（图谱 PREREQUISITE_OF 边优先，未建边回退人工字典；data 含 skill_id/skill_name/prerequisites[{skill_id,name,depth}]）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/SkillPrerequisitesData'
                  trace_id: { type: string }

  /api/v1/graph/skill/{id}/courses:
    get:
      tags: [graph]
      security: []
      summary: 学习课程列表（LEARNABLE_VIA + 质量分降序）
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 课程列表（data 含 skill_id/skill_name/courses[CourseRecommendation]）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/SkillCoursesData'
                  trace_id: { type: string }

  /api/v1/graph/skill/{id}/positions:
    get:
      tags: [graph]
      security: []
      summary: 技能反向查询岗位
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 岗位列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/SkillPositionsData'
                  trace_id: { type: string }

  /api/v1/graph/skill/similar:
    get:
      tags: [graph]
      security: []
      summary: 相似技能检索（pgvector）
      parameters:
        - name: skill_id
          in: query
          required: true
          schema: { type: string }
        - name: top_k
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: 相似技能列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/SkillSimilarData'
                  trace_id: { type: string }

  /api/v1/graph/panorama:
    get:
      tags: [graph]
      security: []
      summary: 全景视图（Neo4j 直接查询，无缓存）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 600 }
        - name: min_weight
          in: query
          schema: { type: number, default: 0.3, minimum: 0, maximum: 1 }
        - name: focus
          in: query
          schema: { type: string }
          description: 以某岗位为中心展开
      responses:
        '200':
          description: 全景图数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    properties:
                      nodes: { type: array, items: { type: object } }
                      edges: { type: array, items: { type: object } }
                      stats: { type: object }

  /api/v1/graph/algorithms/pagerank:
    get:
      tags: [graph]
      security: []
      summary: PageRank 技能重要性 Top-N（纯 Python，Neo4j 社区版无 GDS）
      parameters:
        - name: top_n
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: min_weight
          in: query
          schema: { type: number, minimum: 1.0 }
          description: 共现边权重下限（权重 = 必要性组合因子 × 共现岗位数：must-must=1.0/must-nice=0.5/nice-nice=0.2 再 × 共现数）。省略时取 configs/graph_algo.yaml 的调优值（当前 2.5021），与 skill-clusters 取数口径一致
      responses:
        '200':
          description: 技能重要性排名
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/PagerankData'
                  trace_id: { type: string }
  /api/v1/graph/algorithms/skill-clusters:
    get:
      tags: [graph]
      security: []
      summary: Louvain 技能簇识别（纯 Python，γ 分辨率参数化）
      parameters:
        - name: min_size
          in: query
          schema: { type: integer, default: 2, minimum: 1, maximum: 100 }
          description: 过滤过小簇（size < min_size 不返回）
        - name: resolution
          in: query
          schema: { type: number, minimum: 0.1, maximum: 5.0 }
          description: Louvain 分辨率参数 γ（图算法优化方案阶段一）：>1 细簇 / <1 粗簇 / 1.0 等价标准 Louvain。省略时取 configs/graph_algo.yaml 的调优值（当前 1.2564，随配置生效）
        - name: level
          in: query
          schema: { type: integer, default: null, minimum: 0, maximum: 31, nullable: true }
          description: 层级（阶段三层次化提取）：0 = 最细，逐层变粗；默认 null = 最优层（与 louvain() 输出一致）；Leiden 算法不支持层级（忽略）
      responses:
        '200':
          description: 技能簇列表（规则后处理 + LLM 兜底命名 + 层级元数据）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/SkillClustersData'
                  trace_id: { type: string }
  /api/v1/graph/algorithms/community-tree:
    get:
      tags: [graph]
      security: []
      summary: 社区层级树（dendrogram 可视化，阶段三层次化提取）
      description: 读取 scripts/sync_communities.py 同步的 Neo4j Community 节点（BELONGS_TO_COMMUNITY + NESTED_IN），返回树结构供 ECharts tree 系列渲染；未同步时返回空树
      responses:
        '200':
          description: 社区层级树
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    properties:
                      tree:
                        type: array
                        description: 根节点列表（最高层社区，children 按 NESTED_IN 递归展开）
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            level: { type: integer }
                            cluster_count: { type: integer }
                            modularity: { type: number }
                            top_skills:
                              type: array
                              items: { type: string }
                              description: 簇内代表性技能（≤5 个）
                            children:
                              type: array
                              items:
                                $ref: '#/components/schemas/CommunityNode'
                      levels:
                        type: array
                        items: { type: integer }
                        description: 已同步层级列表

  /api/v1/graph/algorithms/shortest-path:
    get:
      tags: [graph]
      security: []
      summary: 技能最短路径（shortestPath((:Skill)-[*..6]-(:Skill))）
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
          description: 起点技能 ID
        - name: to
          in: query
          required: true
          schema: { type: string }
          description: 终点技能 ID
      responses:
        '200':
          description: 最短路径节点序列
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/ShortestPathData'
                  trace_id: { type: string }
        '404':
          description: 两技能间不存在 ≤6 跳可达路径

  /api/v1/graph/view/{view_type}:
    get:
      tags: [graph]
      security: []
      summary: 视图切换（后端过滤）
      parameters:
        - name: view_type
          in: path
          required: true
          schema: { type: string, enum: [panorama, techStack, level, positionCenter] }
      responses:
        '200':
          description: 视图数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/graph/search:
    get:
      tags: [graph]
      security: []
      summary: 图谱搜索（Neo4j 全文索引）
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [position, skill, evidence] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/SearchResultsData'
                  trace_id: { type: string }

  # ============================================================
  # 简历模块 /api/v1/resume
  # ============================================================
  /api/v1/resume/list:
    get:
      tags: [resume]
      summary: 已解析简历列表（最近 N 条，按更新时间倒序）
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 简历缓存列表（含候选人画像摘要）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/ResumeListData'
                  trace_id: { type: string }
  /api/v1/resume/parse:
    post:
      tags: [resume]
      summary: 上传简历触发解析（异步，含 PII 脱敏预处理）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: 已接受，异步处理中
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/ResumeParseTaskData'
                  trace_id: { type: string }
  /api/v1/resume/task/{task_id}:
    get:
      tags: [resume]
      summary: 查询解析任务状态
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/resume/task/{task_id}/stream:
    get:
      tags: [resume]
      summary: "SSE 推送任务进度（event: progress/done/error）"
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/resume/files/{resume_id}/download:
    get:
      tags: [resume]
      summary: 下载简历原始文件（仅上传者本人可下载，admin 无权访问原文）
      parameters:
        - name: resume_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 原始文件字节流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: resume_id 格式非法
        '403':
          description: 非本人无权下载
        '404':
          description: 简历文件不存在

  /api/v1/resume/{resume_id}:
    get:
      tags: [resume]
      summary: 获取解析结果
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 简历数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags: [resume]
      summary: 编辑简历信息
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags: [resume]
      summary: 删除简历
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: 删除成功

  # ============================================================
  # 匹配模块 /api/v1/match
  # ============================================================
  /api/v1/match/recommend:
    post:
      tags: [match]
      summary: 自动推荐 Top-N（异步，ARQ 队列 + 含 CII 通胀修正）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_id]
              properties:
                resume_id: { type: string }
                top_n: { type: integer, default: 10, maximum: 50 }
      responses:
        '202':
          description: 任务已入队，返回 task_id（轮询 /match/task/{task_id} 获取进度与结果）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/RecommendTaskResult'
                  trace_id: { type: string }
  /api/v1/match/compare:
    post:
      tags: [match]
      summary: 人岗比对（含差距三态 + 学习路径）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_id, position_id]
              properties:
                resume_id: { type: string }
                position_id: { type: string }
      responses:
        '200':
          description: |
            匹配结果 + gaps（GapSkill[]，三态）+ learning_path
            （LearningPathItem[]，missing/weak 技能先修链 + 课程 Top-3）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/MatchResult'
                  trace_id: { type: string }
  /api/v1/match/task/{task_id}:
    get:
      tags: [match]
