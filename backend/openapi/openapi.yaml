                minItems: 2
                maxItems: 2
                description: 请求间隔 [min, max] 秒（1-300）
        # ── ETL 队列（08-21 配置中心新增）──
        etl_batch_cap: { type: integer, description: ETL 批次上限（积压缩放封顶，100-5000） }
        etl_structure_load_default: { type: integer, description: 结构化加载默认批次（100-1000） }
        etl_validate_temporal_default: { type: integer, description: 时滞/通胀检测默认批次（100-500） }
        etl_run_hour: { type: integer, description: ETL 调度小时（0-23，容器内 ARQ cron） }
        etl_run_minute: { type: integer, description: ETL 调度分钟（0-59） }
        # ── 每爬虫采集配置（08-21：开关 + 采集数量；08-21b：独立触发时间）──
        crawlers:
          type: object
          description: 每爬虫采集配置（spider → {enabled, max_results, max_empty_retries, hour, minute}）；缺省启用、按源默认数量
          additionalProperties:
            type: object
            properties:
              enabled: { type: boolean, description: 是否参与 ETL 调度（false=停用） }
              max_results: { type: integer, description: 单次采集条数上限（仅 arxiv/zhilian 消费；10-1000） }
              max_empty_retries: { type: integer, description: 页面级空列表退避重试次数（0=关闭，1-10；zhilian 消费，默认 3） }
              hour: { type: integer, description: 独立触发小时（0-23；配置后该爬虫单独 cron 触发，缺省并入主管线） }
              minute: { type: integer, description: 独立触发分钟（0-59；与 hour 成对） }
        # ── dict-guard 字典守卫（08-24 契约补齐：管理面板可编辑）──
        dict_guard_enabled: { type: boolean, description: 总开关（false 时 ETL 阶段直接跳过） }
        dict_guard_auto_impact_threshold: { type: integer, description: 自动生效影响面上限（图谱节点数，超过转人工，1-1000） }
        dict_guard_min_confidence: { type: number, description: 自动生效最低 LLM 置信度（0.0-1.0） }
        dict_guard_max_candidates: { type: integer, description: 每类候选上限（控制每日 LLM 成本，1-100） }
        dict_guard_reproposal_cooldown_days: { type: integer, description: 驳回提案冷却期（天内不重提，1-90） }

    LlmProviderConfig:
      type: object
      description: LLM provider 配置项（GET/PUT /admin/llm-config）
      required: [name, priority, base_url, model, enabled]
      properties:
        name: { type: string, description: provider 唯一名（字母/数字/下划线/短横线） }
        priority: { type: integer, description: 尝试优先级（1 最高，唯一） }
        base_url: { type: string }
        api_key: { type: string, description: 回显时打码（*）；提交空白/含掩码保持原值 }
        api_key_env:
          type: string
          description: 密钥环境变量名（推荐）：key 经 env 注入不落盘；设置后 api_key 明文不再回捞
        model: { type: string }
        supports_function_calling: { type: boolean }
        enabled: { type: boolean }
        protocol:
          type: string
          enum: [openai, anthropic]
          default: openai
          description: API 协议（openai=Chat Completions 兼容，缺省；anthropic=Anthropic Messages 兼容，如 z.ai Coding Plan /api/anthropic）
        extra_body:
          type: object
          description: provider 特定请求参数（如 deepseek 关闭思考模式），编辑时须保留

    LlmConfig:
      type: object
      description: GET/PUT /admin/llm-config 响应/请求 data
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/LlmProviderConfig' }

    # ============================================================
    # LLM 决策与验收（08-24 决策信封：GET /admin/llm-decisions* 只读）
    # ============================================================

    GraphGovernanceDomain:
      type: object
      description: 单个语义域（骨干簇或归类归并结果）
      properties:
        domain_id: { type: string, description: "域键 dom_{cid} 或 dom_general" }
        domain_name: { type: string, description: LLM 语义域名或代表岗名 }
        member_count: { type: integer }
        members:
          type: array
          description: 成员（按 freq 降序，截断至 top 12），含归类依据来源与亲和度得分
          items:
            type: object
            properties:
              name: { type: string }
              freq: { type: integer }
              source: { type: string, description: "归类依据：backbone骨干簇/pin_cluster骨干指派/pin治理指派/attach阈值归类/leftover_pin兜底指派/general_pin治理弃权/below_affinity证据不足/not_dominant多域拉扯/no_edges零投影边/leftover_no_edges投影外零证据" }
              score: { type: number, nullable: true, description: 归类亲和度得分（治理指派/骨干为 null） }
        source_counts:
          type: object
          description: 全成员来源分布（source → 数量）
          additionalProperties: { type: integer }
        is_general: { type: boolean, description: 是否为通用弃权域 }

    GraphGovernanceSummary:
      type: object
      description: 岗位域治理总览
      properties:
        positions: { type: integer, description: 已划分岗位总数 }
        semantic_domains: { type: integer, description: 语义域数（不含通用域） }
        general_count: { type: integer, description: 通用弃权域岗位数 }
        resync_running: { type: boolean, description: 是否有重同步任务进行中 }
        last_resync: { type: string, nullable: true, description: 最近一次完成时间 ISO8601，无记录为 null }
        benchmark:
          type: object
          nullable: true
          description: 共成员基准评测（基准文件缺失/无可评行时为 null）
          properties:
            evaluated: { type: integer }
            strict_accuracy: { type: number }
            pairwise_f1: { type: number }
            failures:
              type: array
              description: 未通过行（position/expect/detail/note）
              items:
                type: object
                properties:
                  position: { type: string }
                  expect: { type: string }
                  detail: { type: string }
                  note: { type: string }
        domains:
          type: array
          items:
            $ref: '#/components/schemas/GraphGovernanceDomain'
        membership_pending: { type: integer, description: cluster_membership 待审记录数 }

    GraphGovernanceResyncResult:
      type: object
      properties:
        started: { type: boolean, description: 已受理后台执行 }
        message: { type: string }

    LlmDecisionItem:
      type: object
      description: 六域 LLM 决策记录（llm_decision_records 行）
      required: [id, domain, status, created_at]
      properties:
        id: { type: string, description: UUID }
        domain: { type: string, description: jd_extract/position_normalize/skill_normalize/position_classify/cluster_label/skill_classify/governance/skill_relation }
        entity_type: { type: string }
        entity_id: { type: string }
        run_id: { type: string }
        env: { type: string }
        input_hash: { type: string }
        evidence_refs:
          type: array
          description: 证据引用（{label,value} 摘要，供人工抽检）
          items:
            type: object
            additionalProperties: true
        provider: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        schema_version: { type: string }
        structured_output:
          type: object
          description: LLM 结构化输出（决策明细，供抽检）
          additionalProperties: true
        confidence: { type: number, nullable: true }
        gate_result: { type: string, description: pass/blocked }
        risk_tier: { type: string, description: R0/R1/R2/blocked }
        status: { type: string, description: shadow/proposal/auto_applied/blocked/rejected/approved/failed/reverted（reverted=自动生效已被人工撤销） }
        reviewer: { type: string }
        review_reason: { type: string }
        effects_applied: { type: boolean }
        rollback_ref: { type: string, description: 回滚引用（可变更动作） }
        duration_ms: { type: integer }
        attempts: { type: integer }
        fallback_reason: { type: string }
        created_at: { type: string, description: ISO8601 }

    LlmDecisionDomainSummary:
      type: object
      description: GET /admin/llm-decisions/summary by_domain 项
      required: [domain, by_status, total]
      properties:
        domain: { type: string }
        by_status:
          type: object
          description: status → count
          additionalProperties: { type: integer }
        total: { type: integer }

    ApprovalStreamSummary:
      type: object
      description: GET /admin/approvals/summary 单条审批流计数项
      required: [id, label, route, description, pending, review, approved]
      properties:
        id: { type: string, description: 稳定标识（前端深链与分组用） }
        label: { type: string, description: 审批流显示名 }
        route: { type: string, description: 前端深链路径（原审核页对应 Tab/独立路由） }
        description: { type: string, description: 流转说明（candidate → emerging 等） }
        pending: { type: integer, description: 待办数 }
        review: { type: integer, description: 需复核/阻断数（如低置信、规则守卫触发） }
        approved: { type: integer, description: 已通过/已生效数 }

    ApprovalSummaryData:
      type: object
      description: GET /admin/approvals/summary data（只读汇总）
      required: [summary, streams]
      properties:
        summary:
          type: object
          description: 全审批池汇总
          required: [total_pending, total_review, total_approved]
          properties:
            total_pending: { type: integer }
            total_review: { type: integer }
            total_approved: { type: integer }
        streams:
          type: array
          description: 各审批流计数（按 pending 降序）
          items:
            $ref: '#/components/schemas/ApprovalStreamSummary'

    SkillAliasItem:
      type: object
      description: 技能别名回写记录（skill_aliases 行，方案① #559/#561）
      required: [id, variant, standard_name, status, created_at]
      properties:
        id: { type: string, description: UUID }
        variant: { type: string, description: 别名变体（如 .NET Framework / 3D Modeling） }
        standard_name: { type: string, description: 归并目标标准名（known_standard_names 内） }
        status: { type: string, description: pending → approved（normalize_skill 生效）/ rejected }
        proposal_id: { type: string, description: 来源决策记录 id（llm_decision_records） }
        source: { type: string, description: 来源（llm_review） }
        reviewed_by: { type: string, description: 审批人（UUID） }
        review_reason: { type: string, description: 审批理由 }
        confidence: { type: number, nullable: true, description: LLM merge 置信度 }
        applied_to_graph: { type: boolean, description: 图同步进度标记（别名 approve 即生效，此字段预留） }
        created_at: { type: string, description: ISO8601 }

    SkillAdminItem:
      type: object
      description: 技能治理列表项（GET /admin/skills：白名单标准名 ∪ approved 别名标准名聚合）
      required: [name, in_whitelist, is_noise]
      properties:
        name: { type: string, description: 技能标准名 }
        category: { type: string, description: 分类（白名单内取 skill_whitelist.yaml category；白名单外可为空） }
        in_whitelist: { type: boolean, description: 是否在 skill_whitelist.yaml（幻觉防控第三道防线单一事实源） }
        is_noise: { type: boolean, description: 是否命中噪声过滤词 }
        aliases:
          type: array
          description: approved 别名变体列表
          items: { type: string }

    SkillAliasReviewIn:
      type: object
      description: POST /admin/skill-aliases/{alias_id}/review 请求体
      required: [approved]
      properties:
        approved: { type: boolean, description: true=通过并写入动态别名表 / false=驳回 }
        reason: { type: string, maxLength: 500, description: 审批理由 }

    SkillAliasReviewOut:
      type: object
      description: 别名复核响应 data
      required: [id, status, approved]
      properties:
        id: { type: string, description: 别名 UUID }
        status: { type: string, description: 复核后状态（approved/rejected） }
        approved: { type: boolean }

    # ============================================================
    # 演化模块端点 data（08-14 契约补全：versions/diff/trends/signals/state-machine/watch）
    # ============================================================

    EvolutionVersion:
      type: object
      description: 图谱版本列表项（GET /evolution/versions）
      required: [version_id, change_summary, node_added, node_removed, node_changed]
      properties:
        version_id: { type: string }
        created_at: { type: string, nullable: true, description: 创建时间 ISO8601 }
        change_summary: { type: string, description: 版本变更摘要 }
        triggered_by: { type: string, nullable: true, description: 触发来源 }
        node_added: { type: integer }
        node_removed: { type: integer }
        node_changed: { type: integer }
        data_warning:
          type: object
          nullable: true
          additionalProperties:
            type: object
            description: 机制补强①样本量告警（evidence 量比上版本萎缩<50%/膨胀>200%）
            properties:
              prev: { type: integer }
              cur: { type: integer }
              ratio: { type: number }
              direction: { type: string, enum: [shrunk, surged] }

    EvolutionVersionListData:
      type: object
      description: GET /evolution/versions 响应 data（分页）
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EvolutionVersion' }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }

    EvolutionDiffNode:
      type: object
      description: 版本 Diff 节点项
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }

    EvolutionDiff:
      type: object
      description: 两个版本快照 Diff（GET /evolution/diff）
      required: [nodes_added, nodes_removed, nodes_changed, edges_added, edges_removed]
      properties:
        nodes_added:
          type: array
          items: { $ref: '#/components/schemas/EvolutionDiffNode' }
        nodes_removed:
          type: array
          items: { $ref: '#/components/schemas/EvolutionDiffNode' }
        nodes_changed:
          type: array
          items: { $ref: '#/components/schemas/EvolutionDiffNode' }
        edges_added:
          type: array
          items: { type: string, description: "source->target" }
        edges_removed:
          type: array
          items: { type: string, description: "source->target" }

    EvolutionTrendPoint:
      type: object
      description: 技能频次趋势采样点
      properties:
        date: { type: string, nullable: true, description: 快照日期 YYYY-MM-DD }
        version: { type: string }
        freq: { type: integer, description: 该技能被引用边数 }

    EvolutionTrendsData:
      type: object
      description: GET /evolution/trends 响应 data
      required: [skill, window, points]
      properties:
        skill: { type: string, description: 技能节点 ID }
        window: { type: integer }
        points:
          type: array
          items: { $ref: '#/components/schemas/EvolutionTrendPoint' }

    SkillFlowNode:
      type: object
      description: 桑基图节点（岗位×期次，id 全局唯一）
      required: [id, name, period_index, freq]
      properties:
        id: { type: string, description: "岗位节点 ID@期次序号，如 pos_abc::3" }
        name: { type: string, description: 岗位名称 }
        period_index: { type: integer, description: 所在期次序号（0 起升序） }
        freq: { type: integer, description: 该期该技能在此岗位的 REQUIRES 频次 }

    SkillFlowLink:
      type: object
      required: [source, target, value]
      properties:
        source: { type: string, description: 左侧期次节点 id }
        target: { type: string, description: 右侧期次节点 id（同名岗位相邻期） }
        value: { type: integer, description: 左侧期次频次 }

    SkillFlowData:
      type: object
      description: GET /evolution/skill/{id}/flow 响应 data（桑基图三元组）
      required: [skill_id, skill_name, periods, nodes, links]
      properties:
        skill_id: { type: string }
        skill_name: { type: string, description: 快照中最近出现的技能名 }
        periods:
          type: array
          description: 期次标签（快照日期 ISO，升序，与 period_index 对齐）
          items: { type: string, nullable: true }
        top: { type: integer, description: 每期 Top-N 岗位截断 }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/SkillFlowNode' }
        links:
          type: array
          items: { $ref: '#/components/schemas/SkillFlowLink' }


    EvolutionSignal:
      type: object
      description: 技能演化信号（GET /evolution/signals，设计文档 §7.1 Z-score）
      required: [skill_id, skill_name, current_freq, trend, confidence, evidence_refs]
      properties:
        skill_id: { type: string }
        skill_name: { type: string }
        z_score: { type: number, nullable: true, description: Z-score（小基数保护态为 null） }
        mom_growth: { type: number, nullable: true, description: 环比增长率（原始计数口径） }
        current_freq: { type: integer }
        historical_mean:
          type: number
          nullable: true
          description: 历史窗口均值 μ（Z-score 序列口径：全序列有占比分母时为
            占比，否则整序列退回原始计数；与 current_freq/mom_growth 的计数口径并存）
        historical_std:
          type: number
          nullable: true
          description: 历史窗口标准差 σ（口径同 historical_mean）
        trend: { type: string, enum: [emerging, rising, stable, declining, protected] }
        confidence: { type: number }
        evidence_refs:
          type: array
          items: { type: string }
        warning:
          type: boolean
          description: 证据量异常期标记（双层抗波动）：命中 data_warning 的快照
            已在检测侧整期剔除；此标记为展示侧打标不剔除——信号解读期
            （最近两期快照）任一命中时为 true，信号照常输出、提示谨慎解读
        freq_ratio:
          type: number
          nullable: true
          description: 归一化展示口径 = 当期技能频次 / 当期 REQUIRES 总边数（不参与 Z-score 判定）

    EvolutionVersionWarning:
      type: object
      description: 命中样本量对比告警的图谱版本（供 signals 响应透出）
      required: [version_id, warning]
      properties:
        version_id: { type: string }
        created_at: { type: string, nullable: true }
        warning:
          type: object
          description: compute_data_warning 产出（positions/requires_edges 各含 prev/cur/ratio/direction）

    EvolutionSignalsData:
      type: object
      description: GET /api/v1/evolution/signals 响应 data
      required: [window_count, emerging, declining]
      properties:
        window_count: { type: integer, description: 参与计算的快照窗口数 }
        emerging:
          type: array
          items: { $ref: '#/components/schemas/EvolutionSignal' }
        declining:
          type: array
          items: { $ref: '#/components/schemas/EvolutionSignal' }
        warnings:
          type: array
          description: 全序列命中 data_warning 的版本明细（最新在前）
          items: { $ref: '#/components/schemas/EvolutionVersionWarning' }

    EvolutionVersionDetail:
      type: object
      description: 版本详情（GET /evolution/versions/{version_id}）
      required: [version_id, change_summary, node_added, node_removed, node_changed, stats, nodes]
      properties:
        version_id: { type: string }
        created_at: { type: string, nullable: true }
        change_summary: { type: string }
        triggered_by: { type: string, nullable: true }
        node_added: { type: integer }
        node_removed: { type: integer }
        node_changed: { type: integer }
        data_warning:
          type: object
          nullable: true
          additionalProperties:
            type: object
            description: 机制补强①样本量告警（evidence 量比上版本萎缩<50%/膨胀>200%）
            properties:
              prev: { type: integer }
              cur: { type: integer }
              ratio: { type: number }
              direction: { type: string, enum: [shrunk, surged] }
        stats:
          type: object
          description: 快照统计
          properties:
            nodes: { type: integer }
            edges: { type: integer }
            by_type:
              type: object
              description: 节点类型计数（skill/position/...）
              additionalProperties: { type: integer }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/EvolutionDiffNode' }
          description: 快照节点列表（不含边）

    EvolutionEvent:
      type: object
      description: 谱系事件（机制补强② born/merged/ended，GET /evolution/events）
      required: [id, version_id, event_type]
      properties:
        id: { type: integer }
        version_id: { type: string }
        event_type: { type: string, enum: [born, merged, ended] }
        from_name: { type: string, nullable: true, description: 旧名（ended/merged） }
        to_name: { type: string, nullable: true, description: 新名（born/merged） }
        created_at: { type: string, nullable: true }
        detail:
          type: object
          nullable: true
          description: 附加结构（如 merged 的 from_names 数组）

    EvolutionEventListData:
      type: object
      description: GET /evolution/events 响应 data
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EvolutionEvent' }

    PositionEvolutionPoint:
      type: object
      description: 岗位演化采样点
      properties:
        date: { type: string, nullable: true }
        version: { type: string }
        freq: { type: integer, description: 该岗位被引用边数 }
