  /api/v1/admin/llm-config:
    get:
      tags: [admin]
      summary: 读取 LLM provider 配置（api_key 打码，admin only）
      responses:
        '200':
          description: 当前生效配置（providers/routing/failover 等，api_key 已打码）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/LlmConfig'
                  trace_id: { type: string }
    put:
      tags: [admin]
      summary: 保存 LLM provider 配置（持久化到 llm_providers.yaml）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providers]
              properties:
                providers:
                  type: array
                  description: provider 列表，api_key 留空或 **** 表示保持原值
                  items:
                    type: object
                    required: [name, base_url, model, priority, enabled]
                    properties:
                      name: { type: string, description: provider 标识（英文短横线） }
                      base_url: { type: string, format: uri }
                      api_key: { type: string, description: "留空或 **** 表示保持原值；明文才更新。推荐改用 api_key_env" }
                      api_key_env: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$", description: "密钥环境变量名：key 经 env 注入不落盘（推荐方式）" }
                      model: { type: string }
                      priority: { type: integer, minimum: 1, description: 数字越小优先级越高，列表内唯一 }
                      enabled: { type: boolean }
                      supports_function_calling: { type: boolean }
                      extra_body:
                        type: object
                        description: provider 特定请求参数（如 deepseek 关闭思考模式），编辑时须保留
      responses:
        '200':
          description: 保存成功，返回打码后的最新配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/LlmConfig'
                  trace_id: { type: string }

