    get:
      tags: [discovery]
      summary: 岗位技能增减（两版快照对比，登录可见）
      description: 取两期 graph_versions 快照（缺省最近两期，可显式指定 from/to 版本），按岗位 source 过滤 REQUIRES 边做集合差，返回新增/移除/未变技能
      parameters:
        - name: position
          in: query
          required: true
          schema: { type: string }
          description: 岗位 id（pos_xxx）或岗位名（与图谱 Position.name 对齐）
        - name: from_version
          in: query
          required: false
          schema: { type: string }
          description: 对比基准版 id（缺省=次新版本）
        - name: to_version
          in: query
          required: false
          schema: { type: string }
          description: 目标版 id（缺省=最新版本）
      responses:
        '200':
          description: 该岗位最近两版技能增减（data 含 added/removed/unchanged + 版本信息）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/PositionSkillsDeltaData'
                  trace_id: { type: string }
        '404':
          description: 无图谱版本数据（快照不足 2 期）或岗位不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { nullable: true }
                  trace_id: { type: string }
