      description: 取两期 graph_versions 快照（缺省最近两期，可显式指定 from/to），一次返回全部岗位的技能增减计数与可用版本列表——供下拉仅列有增减岗位、稳定面板列无增减岗位
      parameters:
        - name: from_version
          in: query
          required: false
          schema: { type: string }
          description: 对比基准版 id（缺省=次新版本）
        - name: to_version
          in: query
          required: false
          schema: { type: string }
          description: 目标版 id（缺省=最新版本）
      responses:
        '200':
          description: 全岗位增减汇总 + 可用版本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/PositionSkillsDeltaSummaryData'
                  trace_id: { type: string }
        '404':
          description: 无图谱版本数据（快照不足 2 期）或指定版本不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { nullable: true }
                  trace_id: { type: string }
