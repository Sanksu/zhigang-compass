  /api/v1/admin/llm-decisions/{decision_id}/approve:
    post:
      tags: [admin]
      summary: 批准图变异类 proposal/shadow——落图变更持久化表 + 决策置 approved（RBAC admin；skill_relation / position_normalize / skill_normalize / skill_classify）
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMDecisionReviewRequest'
      responses:
        '200':
          description: 批准成功（域名；skill_relation 返回 relation 形如 源->目标->类型，名称归一返回 normalization 形如 action:源->目标；skill_classify 接受 shadow 记录并返回 category/skill）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      decision_id: { type: string }
                      relation: { type: string, description: skill_relation 专用：源->目标->类型 }
                      normalization: { type: string, description: 名称归一专用：action:源->目标（noop 表示确认原样） }
                      source: { type: string, description: 名称归一专用：源名 }
                      target: { type: string, description: 名称归一专用：目标名 }
                      category: { type: string, description: skill_classify 专用：批准后的权威分类 }
                      skill: { type: string, description: skill_classify 专用：技能名 }
                      variant: { type: string, description: 技能别名回写专用（kind=alias）：别名变体 }
                      standard: { type: string, description: 技能别名回写专用（kind=alias）：归并目标标准名 }
                  trace_id: { type: string }

  /api/v1/admin/llm-decisions/{decision_id}/reject:
    post:
      tags: [admin]
      summary: 驳回 proposal/shadow（仅状态流转，效果为 0；skill_classify 接受 shadow）
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMDecisionReviewRequest'
      responses:
        '200':
          description: 驳回成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      decision_id: { type: string }
                  trace_id: { type: string }

  /api/v1/admin/llm-decisions/{decision_id}/undo:
    post:
      tags: [admin]
      summary: 撤销一条 auto_applied 治理决策（governance 域，7 天窗口内）——反做动态过滤/重建课程节点，dict_guard 不再对同实体自动执行；写 AuditLog
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMDecisionReviewRequest'
      responses:
        '200':
          description: 撤销成功（undo 明细：filter_removed 动态条目是否移除 / rebuilt 重建课程节点数 / notes 部分撤销说明）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      decision_id: { type: string }
                      filter_removed: { type: boolean, description: add_stopword 专用：动态停用词条目已移除 }
                      rebuilt: { type: integer, description: remove_node/remove_edge(course) 专用：按 course_raw 同名快照重建的课程节点数 }
                      notes:
                        type: array
                        description: 部分撤销说明（如 course_raw 已无同名记录，节点待重新采集后由课程入图任务自然恢复）
                        items: { type: string }
                  trace_id: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/skill-aliases:
    get:
      tags: [admin]
      summary: 动态别名表列表（技能别名回写产物，normalize_skill 并查源）
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected], description: 状态过滤（空=全部） }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: 别名表分页列表（variant→standard，approved 行为 normalize_skill 生效源）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SkillAliasItem' }
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                  trace_id: { type: string }

  /api/v1/admin/skills:
    get:
      tags: [admin]
      summary: 技能治理列表（白名单标准名 ∪ approved 别名标准名；q/分类/白名单/噪声过滤 + 分页）
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200, description: 关键字（名称或别名模糊匹配） }
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 100, description: 分类过滤（模糊） }
        - name: whitelist
          in: query
          required: false
          schema: { type: string, enum: [all, only, exclude], default: all, description: 白名单过滤（only=仅白名单 / exclude=仅非白名单） }
        - name: noise
          in: query
          required: false
          schema: { type: string, enum: [all, only, exclude], default: all, description: 噪声过滤（only=仅噪声 / exclude=仅非噪声） }
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: 技能治理分页列表（data 含 items/total/page/size）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SkillAdminItem' }
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
                  trace_id: { type: string }

  /api/v1/admin/skill-aliases/{alias_id}/review:
    post:
      tags: [admin]
      summary: 别名复核（pending → approved/rejected；写 AuditLog；approved 后热刷新动态别名表即时生效）
      parameters:
        - name: alias_id
          in: path
          required: true
          schema: { type: string, description: 别名 UUID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillAliasReviewIn' }
      responses:
        '200':
          description: 复核成功（data 含 id/status/approved）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { $ref: '#/components/schemas/SkillAliasReviewOut' }
                  trace_id: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 仅 pending 可复核（当前状态非 pending 返回 409）

  /api/v1/admin/positions/{position_name}:
    get:
      tags: [admin]
      summary: 岗位详情（人工编辑前查看技能/学历/证书与文本定义）
      parameters:
        - name: position_name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 岗位详情（skills 列表 + core_duties/scenarios + education/certifications）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/PositionEditDetail'
                  trace_id: { type: string }
        '404':
          description: 岗位不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    put:
      tags: [admin]
      summary: 人工编辑岗位定义（技能增删/necessity 切换/weight 调整/文本修改），变更写入 PositionEditLog 节点
      parameters:
        - name: position_name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPositionEditRequest'
      responses:
        '200':
          description: 保存结果（updated/diff_summary）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/PositionEditResult'
                  trace_id: { type: string }
        '422':
          description: 参数不合法（weight 越界 / necessity 非法等，Pydantic 强校验 code 4000）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: 岗位不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/admin/positions/pending:
    get:
      tags: [admin]
      summary: 待审核岗位列表
      description: 默认返回 candidate（待 admin 审核是否晋升 emerging），可切换状态过滤
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            default: candidate
            enum: [candidate, emerging, stable, declining]
          description: 候选池状态过滤（缺省 candidate——摘要/徽标计数的待审核口径）
      responses:
        '200':
          description: 待审核列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/DiscoveryCandidateData'
                  trace_id: { type: string }

  /api/v1/admin/positions/{id}/review:
    post:
      tags: [admin]
      summary: 审核岗位（批准/驳回）
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewActionRequest'
      responses:
        '200':
          description: 审核完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: 参数不合法 / 不满足晋升条件（code 4000）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: 候选岗位不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '409':
          description: 候选岗位当前状态不可审核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/admin/positions/declining:
    get:
      tags: [admin]
      summary: 待归档岗位列表（declining 状态）
      responses:
        '200':
          description: 待归档列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/DiscoveryCandidateData'
                  trace_id: { type: string }

  /api/v1/admin/positions/{id}/archive:
    put:
      tags: [admin]
      summary: 确认衰退归档（declining → archived 终态）
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReasonRequest'
      responses:
        '200':
          description: 归档完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/evolution/pending:
    get:
      tags: [admin]
      summary: 待审核演化变更
      responses:
        '200':
          description: 待审核列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/DiscoveryCandidateData'
                  trace_id: { type: string }

  /api/v1/admin/discovery/watch:
    get:
      tags: [admin]
      summary: 技术热点观察池周报（§7.2.5，admin 可见，供运营周报/审核）
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [watch, candidate_promoted, archived] }
          description: 状态过滤
        - name: source
          in: query
          schema: { type: string }
          description: 信号源过滤（jd/arxiv/course/github/stackoverflow）
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: 观察池信号分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/WatchData'
                  trace_id: { type: string }

  /api/v1/admin/evolution/{id}/review:
    put:
      tags: [admin]
      summary: 审核演化变更
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEvolutionReviewRequest'
      responses:
        '200':
          description: 审核完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/audit/logs:
    get:
      tags: [admin]
      summary: 审计日志查询
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [AUTH, GRAPH, DATA, ADMIN] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 日志列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/AuditLogsData'
                  trace_id: { type: string }

  /api/v1/admin/lineage/positions:
    get:
      tags: [admin]
      summary: 数据血缘岗位列表（跨源校验汇总 + 血缘总览统计）
      description: |
        将 jd_raw 已抽取记录按归一化岗位名分组，输出每组的跨源交叉验证
        （技能 ≥2 源印证 / 薪资异常 / 经验分歧 / 跨源置信度）与血缘总览
        统计。与 ETL cross_validate_jds 同口径，供管理端直观查看此前仅
        留存于管线日志的溯源结果。
      parameters:
        - name: q
          in: query
          schema: { type: string, description: 按岗位名关键字过滤 }
        - name: verified
          in: query
          schema: { type: boolean, description: 仅 ≥2 源印证已验证 }
        - name: below_confidence
          in: query
          schema: { type: boolean, description: 仅低置信（confidence<0.6） }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 血缘岗位分页列表 + 总览统计
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/LineagePositionsData'
                  trace_id: { type: string }

  /api/v1/admin/lineage/positions/{position_name}:
    get:
      tags: [admin]
      summary: 单个岗位的数据血缘详情（证据 JD 血缘链明细）
      description: |
        返回单个岗位的组级跨源校验 + 血缘链明细（组内每条证据 JD：
        source / source_url / crawled_at / city / salary / skills /
        是否 SimHash 去重标记），溯源到原始招聘来源。
      parameters:
        - name: position_name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 岗位血缘详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/LineageDetail'
                  trace_id: { type: string }
        '404':
          description: 岗位不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/dict-guard/proposals:
    get:
      tags: [admin]
      summary: 字典守卫待审提案列表
      description: dict-guard 每日评估产出的调整提案（remove/protect/超阈值 add），默认返回 pending
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, default: pending, enum: [pending, approved, rejected] }
          description: 提案状态过滤
        - name: entity_type
          in: query
          required: false
          schema: { type: string, enum: [skill, position, course] }
          description: 治理对象类型过滤（skill=技能字典 / position=岗位节点 / course=课程节点或脏边）
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 提案分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/DictProposalItem' } }
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
                  trace_id: { type: string }

  /api/v1/admin/dict-guard/proposals/{id}/review:
    post:
      tags: [admin]
      summary: 审核字典调整提案（批准执行 / 驳回）
      description: >
        approve 按提案 action 执行动态过滤层变更并写 DictChangeLog(source=manual) + AuditLog：
        add_stopword=动态 blocked 即时生效并清理同名 Skill；remove_stopword 对动态条目移除、
        对静态停用词以受影响技能的动态 protect 落地（不动 git 词表）；protect_whitelist=动态 protected。
        reject 仅置状态无副作用。
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewActionRequest'
      responses:
        '200':
          description: 审核完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '422':
          description: 参数不合法（code 4000）
          content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: 提案不存在
          content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiResponse' }
        '409':
          description: 状态不可审核 / 静态停用词移除缺少受影响技能
          content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/admin/dict-guard/changes:
    get:
      tags: [admin]
      summary: 字典变更审计列表
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 变更分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/DictChangeLogItem' } }
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }
                  trace_id: { type: string }

  /api/v1/admin/dict-guard/changes/{id}/rollback:
    post:
      tags: [admin]
      summary: 回滚字典变更
      description: 按变更记录反向操作动态过滤层（blocked→移除 / protected→解除），写 source=rollback 审计；同一记录防重复回滚
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 回滚完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: 变更记录不存在
          content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiResponse' }
        '409':
          description: 已是回滚记录或已回滚过
          content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/admin/dict-guard/report/latest:
    get:
      tags: [admin]
      summary: 最近一次字典守卫巡检报告
      responses:
        '200':
          description: 报告原文（run_date/candidates/evaluated/auto_applied/proposals 等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: 暂无巡检报告
          content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/admin/dict-guard/trigger:
    post:
      tags: [admin]
      summary: 手动触发一次字典守卫巡检
      description: 入队 dict_guard_daily（复跑 ETL 阶段 16），非实时；运行结果落 reports/dict_guard_{date}.json
      responses:
        '202':
          description: 已提交（等待 worker 执行）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '500':
          description: 任务入队失败
          content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiResponse' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    SkillId:
      name: skill_id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    RateLimited:
      description: 请求限流
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'

  schemas:
    DictProposalItem:
      type: object
      required: [id, term, action, status, run_date, created_at]
      properties:
        id: { type: string }
        entity_type: { type: string, enum: [skill, position, course], description: 治理对象类型 }
        term: { type: string, description: 动作作用的目标词（岗位/课程时为目标节点名） }
        action: { type: string, enum: [add_stopword, remove_stopword, protect_whitelist, remove_node, remove_edge] }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string, description: LLM 判定理由 }
        llm_confidence: { type: number, nullable: true, description: LLM 置信度 0~1 }
        evidence:
          type: array
          nullable: true
          items: { type: object }
          description: 候选证据（图谱引用数/语料命中/受影响技能/孤立度等）
        impact_stats: { type: object, description: "影响面模拟：图谱节点数 + 引用 JD 数" }
        run_date: { type: string, description: 评估批次日期 }
        reviewed_by: { type: string }
        review_reason: { type: string }
        reviewed_at: { type: string, nullable: true }
        created_at: { type: string }

    DictChangeLogItem:
      type: object
      required: [id, term, action, source, kind, applied_by, created_at]
      properties:
        id: { type: string }
        entity_type: { type: string, enum: [skill, position, course], description: 治理对象类型 }
        term: { type: string }
        action: { type: string, description: 变更动作（含 rollback） }
        source: { type: string, enum: [auto, manual, rollback] }
        kind: { type: string, enum: [blocked, protected, node, edge], description: 变更类型（skill=动态层条目，position/course=图谱节点/边清理） }
        proposal_id: { type: string, nullable: true }
        reason: { type: string }
        detail: { type: object }
        impact_stats: { type: object }
        applied_by: { type: string }
        created_at: { type: string }
    AdminReviewActionRequest:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, enum: [approve, reject], description: 审核动作 }
        reason: { type: string, minLength: 1, maxLength: 500, description: 审核理由（必填，不能为纯空白） }
    AdminReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: 归档理由（必填，不能为纯空白） }
    AdminEvolutionReviewRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, reject] }
        reason: { type: string, maxLength: 500, description: 审核理由（可选，缺省 admin evolution review） }
        modified: { type: object, description: "approve 时合并进候选池 features 的属性修订；允许键集=DiscoveryFeatures 字段：jd_freq_ma3/z_score/source_diversity/cross_source_consistency/arxiv_paper_count/github_star_velocity/first_seen_date（读取侧 DiscoveryFeatures(**features) 忽略未知键）" }
    LLMDecisionReviewRequest:
      type: object
      required: [review_reason]
      properties:
        review_reason: { type: string, minLength: 1, maxLength: 500, description: 审批理由（必填，不能为纯空白） }
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 100 }
        password: { type: string, minLength: 6, maxLength: 256, format: password }
        role: { type: string, enum: [admin, user, guest], default: user }
    UpdateUserRequest:
      type: object
      description: 部分更新（未传字段不动）
      properties:
        role: { type: string, enum: [admin, user, guest] }
        status: { type: string, enum: [active, disabled] }
    AdminPositionEditRequest:
      type: object
      description: 岗位定义人工编辑（均可选，全空为无变更空操作）
      properties:
        skills:
          type: array
          description: 技能全量替换（缺省不变更），每项含 name/necessity/weight
          items:
            type: object
            required: [name, necessity, weight]
            properties:
              name: { type: string, minLength: 1, maxLength: 100, description: 技能名 }
              necessity: { type: string, enum: [must, nice] }
              weight: { type: number, minimum: 0.0, maximum: 1.0 }
        core_duties:
          type: array
          description: 核心职责（字符串数组，全量替换）
          items: { type: string }
        scenarios:
          type: array
          description: 典型场景（字符串数组，全量替换）
          items: { type: string }
    CrawlTriggerRequest:
      type: object
      required: [platform]
      properties:
        platform: { type: string, minLength: 1, maxLength: 50, description: "平台 ID：boss/zhilian/monster/indeed/glassdoor/linkedin/maimai/github/stackoverflow/arxiv/icourse163/coursera/edx" }
        keyword: { type: string, maxLength: 200, description: "关键词（可选，留空则采集平台热度/最新内容，08-16 起爬虫不再内置默认关键词）" }
        city: { type: string, maxLength: 50, description: "城市（可选，海外源默认英文城市）" }
    ApiResponse:
      type: object
      required: [code, msg, trace_id]
      properties:
        code:
          type: integer
          description: |
            0=成功，非 0=业务错误码（设计文档 §2.4.7）：4000 参数校验 / 4010 未认证 /
            4011 Token 过期 / 4030 无权限 / 4040 资源不存在 / 4090 资源或状态冲突 /
            4290 请求限流 / 5000 内部错误（含 LLM 能力不可用场景，HTTP 503）/
            5001 Neo4j 查询失败 / 5002 pgvector 查询失败 /
            5003 LLM 超时（HTTP 504）
        msg:
          type: string
        data:
          description: 业务数据（成功时存在）
        trace_id:
          type: string
          description: 链路追踪 ID（uuid4 hex 截断 16 位）

    GraphViewType:
      type: string
      enum: [panorama, techStack, positionCenter, positionPortrait]
      description: 图谱视图类型（服务端过滤；positionCenter 无独立页签，作为岗位画像下拉选项数据源保留）

    GraphNode:
      type: object
      description: 图谱节点（Position/Skill/attr 属性维度，匿名视角候选岗位不外宣）
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [position, skill, evidence, attr] }
        status:
          type: string
          enum: [active, candidate, emerging, stable, declining, archived]
          description: 岗位状态机（仅 position 节点；active=图谱常态岗位，非发现状态机成员）
        domain_id: { type: string, nullable: true, description: "岗位职能域 ID（仅 position；岗位投影 Leiden 社区，sync_position_domains 回填，未回填为 null）" }
        domain_name: { type: string, nullable: true, description: "岗位职能域显示名（域代表岗位名，仅 position；未回填为 null）" }
        skill_category: { type: string, nullable: true, description: "技能类目（仅 skill 节点；来自 skill_whitelist.yaml 的 category，白名单外未写入为 null，「软技能」=软素质类；positionPortrait 视图 attr 节点复用承载大类名/「画像条目」）" }
        portrait_category: { type: boolean, description: "岗位画像大类节点标记（仅 positionPortrait 视图 attr 节点：技能/软技能/薪资/经验/学历中环）" }
        evidence_count: { type: integer, nullable: true, description: "证据条数（仅 positionPortrait 视图 position 节点返回）" }
        value: { type: number, description: "节点权重（positionPortrait 视图：岗位取 JD 频次、技能取边 weight）" }

    GraphEdge:
      type: object
      description: 图谱边（REQUIRES 关系）
      required: [source, target]
      properties:
        source: { type: string, description: 源节点 id（岗位） }
        target: { type: string, description: 目标节点 id（技能） }
        weight: { type: number, description: 边权重（聚合口径 must=0.8/nice=0.4） }
        necessity: { type: string, enum: [must, nice] }
        level: { type: string, description: 熟练度级别（初级/中级/高级/专家） }

    GraphViewStats:
      type: object
      description: 视图统计（nodes/edges 为本次返回数；total_* 为图谱全量，可大于返回数）
      properties:
        nodes: { type: integer }
        edges: { type: integer }
        total_nodes:
          type: integer
          description: 图谱全量节点总数（limit 截断后的总量）
        total_edges:
          type: integer
          description: 图谱全量边总数

    GraphViewData:
      type: object
      description: 图谱视图响应（四种视图同构）
      required: [view_type, nodes, edges, stats]
      properties:
        view_type: { $ref: '#/components/schemas/GraphViewType' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/GraphEdge' }
        stats: { $ref: '#/components/schemas/GraphViewStats' }

    CommunityNode:
      type: object
      description: 社区层级树节点（阶段三层次化提取，dendrogram 可视化）
      properties:
        id: { type: string }
        name:
          type: string
          description: 社区名称（簇内 Top-3 技能拼接）
        level: { type: integer }
        cluster_count: { type: integer }
        modularity: { type: number }
        top_skills:
          type: array
          items: { type: string }
          description: 簇内代表性技能（≤5 个）
        children:
          type: array
          items:
            $ref: '#/components/schemas/CommunityNode'
          description: NESTED_IN 嵌套子社区（递归）

    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, user, guest] }
        email: { type: string, nullable: true, description: 邮箱（可能为空） }
        phone: { type: string, nullable: true, description: 手机号（可能为空） }
        bio: { type: string, nullable: true, description: 个人简介 }
        created_at: { type: string, nullable: true, description: 注册时间 ISO8601 }

    GapSkill:
      type: object
      description: 技能差距项（设计文档 §9.5 三态）
      required: [skill, necessity, gap_type, weight, priority]
      properties:
        skill: { type: string, description: 技能名 }
        skill_id: { type: string, nullable: true, description: 图谱技能 ID }
        necessity: { type: string, enum: [must, nice] }
        gap_type: { type: string, enum: [missing, weak, matched] }
        is_soft: { type: boolean, description: 是否软技能（岗位侧 Position.soft_skills 并入或 Skill.category=「软技能」；仅展示打标，不影响评分） }
        weight: { type: number, description: 技能权重 }
        priority: { type: string, enum: [high, medium, low] }
        current_proficiency: { type: string, nullable: true, description: 候选人当前熟练度 }
        required_proficiency: { type: string, nullable: true, description: 岗位期望熟练度 }
        # ── 数据升级（可选，后端测算回填；前端缺省 mock 兜底）──
        demand: { type: number, minimum: 0, maximum: 1, description: 市场需求度 0-1 }
        trend: { type: number, minimum: -1, maximum: 1, description: 需求趋势 -1..1 }
        roi: { type: number, minimum: 0, maximum: 1, description: 学习性价比 ROI 归一化 0-1（原始 (demand×(trend+1))/cost 以 0.1 为满分基准封顶；前端 ×100 显示 0-100 分，与 demand/trend 同口径） }
        high_roi: { type: boolean, description: 是否高杠杆缺口（Top3 ROI） }
        evidence: { type: array, items: { $ref: '#/components/schemas/MatchEvidenceItem' }, description: 评分/差距证据（JD 要求 vs 简历现状） }

    MatchEvidenceItem:
      type: object
      description: 单条评分/差距证据（数据溯源，task 2.2）
      required: [role, text]
      properties:
        role: { type: string, enum: [jd, resume], description: 来源：JD 要求 / 简历现状 }
        text: { type: string, description: 证据描述文本 }

    CourseRecommendation:
      type: object
      description: 学习课程推荐（质量分 Top-3，设计文档 §4.6）
      required: [course_id, title, platform, recommended, source_url]
      properties:
        course_id: { type: string, description: 图谱 Course ID }
        title: { type: string }
        platform: { type: string }
        quality_score: { type: number, nullable: true, minimum: 0, maximum: 1 }
        recommended: { type: boolean }
        source_url: { type: string }
        hours: { type: number, nullable: true, description: 课程时长（小时） }

    LearningPathItem:
      type: object
      description: 单技能学习路径项（甘特图格式，设计文档 §9.5）
      required: [skill, prerequisites, courses, estimated_hours, priority]
      properties:
        skill: { type: string, description: 目标技能名 }
        skill_id: { type: string, nullable: true }
        prerequisites: { type: array, items: { type: string }, description: 先修技能链（先修在前） }
        courses: { type: array, items: { $ref: '#/components/schemas/CourseRecommendation' } }
        estimated_hours: { type: number, description: 预计学习学时 }
        priority: { type: string, enum: [high, medium, low] }
        # ── 双轨制数据升级（可选，后端测算回填；前端缺省 mock 兜底）──
        status: { type: string, enum: [done, doing, locked], description: 学习状态：已掌握/下一步/未解锁 }
        demand: { type: number, minimum: 0, maximum: 1, description: 市场需求度 0-1 }
        trend: { type: number, minimum: -1, maximum: 1, description: 需求趋势 -1..1 }
        roi: { type: number, minimum: 0, maximum: 1, description: 学习性价比 ROI 归一化 0-1（原始 (demand×(trend+1))/cost 以 0.1 为满分基准封顶；前端 ×100 显示 0-100 分，与 demand/trend 同口径） }
        evidence: { type: array, items: { $ref: '#/components/schemas/MatchEvidenceItem' }, description: 学习/评分证据 }

    # ============================================================
    # 图详情端点 data（08-14 契约补全：skill/position 详情、搜索）
    # ============================================================

    SkillPositionItem:
      type: object
      description: 技能反向查询岗位项（GET /graph/skill/{skill_id}/positions）
      required: [position_id, position_name, necessity, weight, level]
      properties:
        position_id: { type: string }
        position_name: { type: string }
        necessity: { type: string, enum: [must, nice] }
        weight: { type: number }
        level: { type: string }

    SkillPositionsData:
      type: object
      description: GET /graph/skill/{skill_id}/positions 响应 data
      required: [skill_id, positions]
      properties:
        skill_id: { type: string }
        positions:
          type: array
          items: { $ref: '#/components/schemas/SkillPositionItem' }

    PositionSkillItem:
      type: object
      description: 岗位详情技能项（GET /graph/position/{id} must_skills/nice_skills）
      required: [skill_id, skill_name, necessity, weight, level, source_count]
      properties:
        skill_id: { type: string }
        skill_name: { type: string }
        necessity: { type: string, enum: [must, nice] }
        weight: { type: number }
        level: { type: string }
        source_count: { type: integer }
        skill_category: { type: string, nullable: true, description: "技能类目（skill_whitelist.yaml 的 category，「软技能」=软素质类，白名单外为 null）" }

    PositionDetail:
      type: object
      description: 岗位节点详情（GET /graph/position/{id}）
      required: [id, name, must_skills, nice_skills]
      properties:
        id: { type: string }
        name: { type: string }
        required_years: { type: number, nullable: true }
        required_education: { type: string, nullable: true }
        salary_min: { type: number, nullable: true, description: 月薪资中位下限（salary_range 解析，币种见 salary_currency） }
        salary_max: { type: number, nullable: true, description: 月薪资中位上限（salary_range 解析，币种见 salary_currency） }
        salary_currency: { type: string, nullable: true, enum: [CNY, USD], description: 薪资币种（国内外区分，08-29 拍板；CNY 优先写图） }
        evidence_count: { type: integer, nullable: true, description: 支撑画像的 JD 证据条数（= 聚合 jd_count） }
        education_distribution:
          type: object
          nullable: true
          description: 学历要求分布（level → jd 条数，条数降序 Top-5）
          additionalProperties: { type: integer }
        experience_distribution:
          type: object
          nullable: true
          description: 经验要求分布（'N年以上' → jd 条数，仅正文明确年限）
          additionalProperties: { type: integer }
        salary_tiers:
          type: array
          nullable: true
          description: 薪资原文档位（解析成功档 Top-5，附 jd 条数）
          items:
            type: object
            properties:
              text: { type: string }
              count: { type: integer }
        salary_range: { type: string, nullable: true, description: 原始薪资文本（未解析成功的展示兜底） }
        last_updated: { type: string, nullable: true, description: 最近更新时间 ISO8601 }
        status: { type: string, enum: [candidate, emerging, stable, declining, archived] }
        must_skills:
          type: array
          items: { $ref: '#/components/schemas/PositionSkillItem' }
        nice_skills:
          type: array
          items: { $ref: '#/components/schemas/PositionSkillItem' }
        soft_skills:
          type: array
          items: { type: string }
          description: 岗位软素质（20 项白名单封闭集，聚合层按频次降序写回；与技术栈技能分离展示）

    SkillEvidenceItem:
      type: object
      description: 技能证据项（GET /graph/skill/{skill_id}/evidence，EVIDENCED_BY 原始 JD）
      required: [id, source, source_url]
      properties:
        id: { type: string }
        source: { type: string }
        source_url: { type: string }
        crawled_at: { type: string, nullable: true, description: 抓取时间 ISO8601 }

    SkillEvidenceData:
      type: object
      description: GET /graph/skill/{skill_id}/evidence 响应 data
      required: [skill_id, skill_name, evidence, evidence_count]
      properties:
        skill_id: { type: string }
        skill_name: { type: string }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/SkillEvidenceItem' }
        evidence_count: { type: integer }

    PortraitEvidenceItem:
      type: object
      description: 画像条目证据 JD 项（GET /graph/position/{id}/portrait-evidence）
      required: [jd_id, source]
      properties:
        jd_id: { type: integer, format: int64, description: "jd_raw 行 id，取正文用 GET /graph/jd/{jd_id}" }
        title: { type: string, description: "岗位名称（snapshot.title）" }
        company: { type: string }
        source: { type: string, description: "来源平台" }
        source_url: { type: string, description: "出处链接（可能为空）" }
        crawled_at: { type: string }
        salary_text: { type: string, description: "该 JD 薪资档位原文（聚合条目键）" }
        experience_label: { type: string, description: "经验分布标签（如 3年以上）" }
        education_level: { type: string, description: "学历要求（大专/本科/硕士/博士）" }
        snippet: { type: string, description: "正文摘要（前 120 字）" }

    PortraitEvidenceData:
      type: object
      description: GET /graph/position/{id}/portrait-evidence 响应 data
      required: [position_id, position_name, dimension, label, total, items]
      properties:
        position_id: { type: string }
        position_name: { type: string }
        dimension: { type: string, enum: [salary, experience, education] }
        label: { type: string, description: "命中的条目标签；空串=该维度全部" }
        total: { type: integer, description: "过滤后证据 JD 总数（items 截断至 limit）" }
        items:
          type: array
          items: { $ref: '#/components/schemas/PortraitEvidenceItem' }

    JdEvidenceDetail:
      type: object
      description: GET /graph/jd/{jd_id} 响应 data（JD 证据正文与出处）
      required: [id, source, raw_text]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        company: { type: string }
        location: { type: string }
        source: { type: string }
        source_url: { type: string, description: "出处链接（可能为空）" }
        crawled_at: { type: string }
        is_desensitized: { type: boolean }
        raw_text: { type: string, description: "JD 原文全文" }

    JdAdminItem:
      type: object
      description: JD 管理列表项（GET /admin/jd）
      required: [id, source, source_id]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        company: { type: string }
        source: { type: string }
        source_id: { type: string }
        source_url: { type: string }
        crawled_at: { type: string }
        is_desensitized: { type: boolean }
        position: { type: string, description: "归一化岗位名（snapshot.normalized_position）" }
        needs_review: { type: boolean, description: "人工复核标记（爬虫质量门 quality <0.6 → 待复核，未经放行不参与 LLM 抽取）" }
        quality: { type: number, nullable: true, description: "质量评分 [0,1]（爬虫清洗管线打分；未打标行为 null）" }
        released_at: { type: string, nullable: true, description: "放行时间（放行走 needs_review true→false 时写入 snapshot.released_at；已放行待重抽行为非空，从未放过行为 null）" }
        has_extraction: { type: boolean, description: "是否已有抽取快照（extraction 键存在；重抽成功后 released_at 清除且该字段为 true，徽标据此不误显）" }
        text_length: { type: integer, description: "raw_text 长度" }
        updated_at: { type: string, description: "最近更新时间（编辑审计参考）" }

    JdAdminPage:
      type: object
      description: GET /admin/jd 响应 data
      required: [total, page, size, items]
      properties:
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/JdAdminItem' }

    JdAdminDetail:
      type: object
      description: GET/PUT /admin/jd/{jd_id} 响应 data
      required: [id, source, source_id, raw_text]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        company: { type: string }
        location: { type: string }
        source: { type: string }
        source_id: { type: string }
        source_url: { type: string }
        crawled_at: { type: string }
        is_desensitized: { type: boolean }
        position: { type: string }
        needs_review: { type: boolean, description: "人工复核标记（爬虫质量门 quality <0.6）" }
        quality: { type: number, nullable: true, description: "质量评分 [0,1]；未打标行为 null" }
        released_at: { type: string, nullable: true, description: "放行时间（放行时写入 snapshot.released_at；已放行待重抽行为非空）" }
        raw_text: { type: string }
        extraction_summary:
          type: object
          description: 抽取摘要（salary_range/education.level/experience_range，只读展示——编辑不自动重抽）
          properties:
            salary_range: { type: string }
            education_level: { type: string }
            experience: { type: string }

    JdAdminUpdate:
      type: object
      description: PUT /admin/jd/{jd_id} 请求体（仅列出的字段被更新；raw_text 变更时 content_hash 同步重算）
      properties:
        title: { type: string }
        company: { type: string }
        location: { type: string }
        source_url: { type: string }
        crawled_at: { type: string }
        raw_text: { type: string }
        needs_review:
          type: boolean
          description: "人工复核结论（缺省=不变更）。true→false 视为放行：后端同步撤销 snapshot.extraction 的 skipped 占位标记，JD 重新进入抽取游标待下轮 batch_extract 抽取；真实抽取产物不受影响；写 AuditLog"

    RawAdminItem:
      type: object
