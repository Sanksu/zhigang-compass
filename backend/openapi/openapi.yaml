      required: [positions, total, page, size]
      properties:
        positions:
          type: array
          items: { $ref: '#/components/schemas/PositionEvolutionData' }
        total: { type: integer, description: 全部岗位数（翻页计算用） }
        page: { type: integer }
        size: { type: integer }

    SkillEvolutionData:
      type: object
      description: 技能演化轨迹（GET /evolution/skills 项）
      required: [skill_id, skill_name, points]
      properties:
        skill_id: { type: string }
        skill_name: { type: string }
        points:
          type: array
          items: { $ref: '#/components/schemas/PositionEvolutionPoint' }

    SkillEvolutionListData:
      type: object
      description: GET /evolution/skills 响应 data（技能演化列表，按快照热度降序分页）
      required: [skills, total, page, size]
      properties:
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillEvolutionData' }
        total: { type: integer, description: 全部技能数（翻页计算用） }
        page: { type: integer }
        size: { type: integer }

    StateMachineTransition:
      type: object
      description: 岗位状态流转记录项（GET /evolution/state-machine）
      required: [id, position_name, operator, reason]
      properties:
        id: { type: integer }
        position_name: { type: string, description: 岗位名（resource_id） }
        operator: { type: string, description: 操作者（admin 用户名） }
        from_state: { type: string, nullable: true }
        to_state: { type: string, nullable: true }
        reason: { type: string }
        created_at: { type: string, nullable: true }

    StateMachineData:
      type: object
      description: GET /evolution/state-machine 响应 data
      required: [states, transitions]
      properties:
        states:
          type: object
          description: 六态分布（candidate/emerging/stable/declining/archived/rejected）
          additionalProperties: { type: integer }
        transitions:
          type: array
          items: { $ref: '#/components/schemas/StateMachineTransition' }

    WatchOverviewItem:
      type: object
      description: 观察池公开摘要项（GET /evolution/watch，MLI 排名）
      required: [skill_name, sources, mli, ready_to_industrialize, status]
      properties:
        skill_name: { type: string }
        sources:
          type: array
          items: { type: string }
          description: 有信号的源（arxiv/course/github/community/jd）
        mli: { type: number, description: "媒介落差指数 [0,1]" }
        ready_to_industrialize: { type: boolean, description: MLI > 0.6 产业化拐点 }
        status: { type: string }
        last_signal_at: { type: string, nullable: true }

    WatchOverviewData:
      type: object
      description: GET /evolution/watch 响应 data（分页）
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WatchOverviewItem' }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }

    # ============================================================
    # 简历模块端点 data（08-14 契约补全）
    # ============================================================

    ResumeSummaryItem:
      type: object
      description: 已解析简历列表项（GET /resume/list）
      required: [id, file_name, skills, total_years]
      properties:
        id: { type: string }
        file_name: { type: string }
        skills:
          type: array
          items: { type: string }
          description: 候选人技能名列表
        total_years: { type: number, description: 工作年限 }
        education_level: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }

    ResumeListData:
      type: object
      description: GET /resume/list 响应 data
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ResumeSummaryItem' }
        total: { type: integer }

    ResumeUpdateRequest:
      type: object
      description: PUT /resume/{resume_id} 请求体（编辑简历画像，fields 按顶层覆盖合并进 parsed_data）
      required: [fields]
      properties:
        fields:
          type: object
          description: 待覆盖合并的画像字段（键为 parsed_data 顶层字段名）
          additionalProperties: true

    ResumeParseTaskData:
      type: object
      description: POST /resume/parse 响应 data（异步解析任务入队）
      required: [task_id, resume_id, cached]
      properties:
        task_id: { type: string }
        resume_id: { type: string }
        cached: { type: boolean, description: 命中缓存直接返回画像 }

    # ============================================================
    # 匹配模块端点 data（08-14 契约补全：compare/result/gap/path/diagnosis/task）
    # ============================================================

    EvidenceRef:
      type: object
      description: 证据引用项（技能 → 原始 JD，图谱 EVIDENCED_BY 链路）
      required: [skill, source, url, confidence]
      properties:
        skill: { type: string }
        source: { type: string }
        url: { type: string }
        confidence: { type: number }

    MatchResult:
      type: object
      description: 单岗位匹配结果（设计文档 §9.4，compare 同步 / result 快照）
      required:
        - match_id
        - position_id
        - position_name
        - total_score
        - must_score
        - nice_score
        - exp_score
        - matched_must
        - missing_must
        - summary
        - unqualified
        - gaps
        - learning_path
        - evidence_refs
      properties:
        match_id: { type: string, description: 结果快照 ID（持久化后供 /match/result 系列查询） }
        user_id: { type: string, description: 归属用户（compare 同步返回） }
        position_id: { type: string }
        position_name: { type: string }
        total_score: { type: number, description: "综合得分 [0,1]" }
        must_score: { type: number, nullable: true, description: "必备技能匹配分 [0,1]；岗位无必备技能门槛时为 null（无信息不判分，总分在 nice/exp 上重归一）" }
        nice_score: { type: number, description: "加分技能匹配分 [0,1]，Top-K 覆盖口径（考核跨源数最高的前 10 条加分项）" }
        exp_score: { type: number }
        matched_must:
          type: array
          items: { type: string }
          description: 已匹配的必备技能名
        matched_nice:
          type: array
          items: { type: string }
          description: 已匹配的加分技能名（JD 证据 hit_count 统一 must+nice 口径）
        missing_must:
          type: array
          items: { type: string }
          description: 缺失的必备技能名
        summary: { type: string, description: 匹配摘要 }
        unqualified: { type: boolean, description: "必备技能全缺失（或无门槛岗位加分技能 Top-K 命中率 <20%）判零" }
        radar:
          type: object
          description: 人岗比对五维雷达（§9.5），无数据维度为 null
          properties:
            must: { type: number, nullable: true, description: '必备技能匹配分 [0,1]，岗位无必备门槛时为 null' }
            nice: { type: number, nullable: true, description: '加分技能匹配分 [0,1]' }
            experience: { type: number, nullable: true, description: '经验匹配分 [0,1]' }
            education: { type: number, nullable: true, description: '学历层级映射近似分 [0,1]，无数据为 null' }
            projects: { type: number, nullable: true, description: '项目匹配近似分 [0,1]，无数据为 null' }
            domain: { type: number, nullable: true, description: 领域匹配分（仅展示） }
            skill_level: { type: number, nullable: true, description: 熟练度满足度（仅展示） }
          required: [must, nice, experience]
        gaps:
          type: array
          items: { $ref: '#/components/schemas/GapSkill' }
          description: 差距三态（missing/weak/matched 按优先级排序）
        learning_path:
          type: array
          items: { $ref: '#/components/schemas/LearningPathItem' }
          description: missing/weak 技能先修链 + 课程 Top-3
        learning_path_blocked:
          type: boolean
          default: false
          description: 学习路径是否因领域跨簇语义黑名单拦截（P1：跨域诱导组合拒绝生成）
        learning_path_block_reason:
          type: string
          nullable: true
          default: null
          description: 拦截原因（命中的岗位行业 × 候选人领域对），未拦截为 null
        evidence_refs:
          type: array
          items: { $ref: '#/components/schemas/EvidenceRef' }
        jd_original:
          type: object
          nullable: true
          description: "最佳匹配 JD 原文（compare 详情溯源：按最佳 JD 行回读 raw_text，正文截断至 8000 字符；旧快照/最佳 JD 行已删除时为 null）"
          required: [jd_title, source, source_url, text]
          properties:
            jd_title: { type: string, description: JD 标题 }
            source: { type: string, description: 采集源（zhilian/boss/indeed 等） }
            source_url: { type: string, description: JD 原文链接 }
            text: { type: string, description: JD 原文正文（截断至 8000 字符） }
        jd_evidence:
          type: array
          description: "JD 级证据（阶段 B：recommend 命中岗位族内原生 JD 二次精排 Top-2；compare/result 旧快照无此字段为空数组）"
          items:
            type: object
            properties:
              position_name: { type: string, description: 归属岗位名 }
              jd_title: { type: string, description: 原生 JD 标题 }
              source: { type: string, description: 采集源（zhilian/boss/indeed 等） }
              source_url: { type: string, description: JD 原文链接 }
              coverage: { type: number, description: "JD 要求满足比例 [0,1]（nice 半计）" }
              hit_count: { type: integer, description: 命中技能数 }
              must_total: { type: integer, description: JD 必备技能总数 }
              nice_total: { type: integer, description: JD 加分技能总数 }
              hit_skills:
                type: array
                items: { type: string }
                description: 命中技能名（前 8）

    MatchTaskStatus:
      type: object
      description: 匹配任务状态（GET /match/task/{task_id}）
      required: [task_id, status]
      properties:
        task_id: { type: string }
        status: { type: string, enum: [pending, running, success, failed] }
        progress: { type: integer, description: "进度 [0,100]" }
        error: { type: string }
        match_id: { type: string, description: 成功后附，供拉取结果 }

    DiagnosisTaskResponse:
      type: object
      description: POST /match/result/{match_id}/diagnosis 响应 data
      required: [task_id, status]
      properties:
        task_id: { type: string }
        status: { type: string, enum: [pending, running, success, failed] }
        match_id: { type: string }
        report: { $ref: '#/components/schemas/DiagnosisReport', nullable: true }
        error: { type: string }

    RecommendTaskResult:
      type: object
      description: POST /match/recommend 响应 data（ARQ 入队）
      required: [task_id]
      properties:
        task_id: { type: string }

    MatchResultList:
      type: object
      description: GET /match/result/{match_id} 响应 data
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MatchResult' }
          description: 推荐任务结果列表（recommend 多岗位）

    MatchGapData:
      type: object
      description: GET /match/result/{match_id}/gap 响应 data
      required: [match_id, gaps]
      properties:
        match_id: { type: string }
        gaps:
          type: array
          items: { $ref: '#/components/schemas/GapSkill' }

    MatchPathData:
      type: object
      description: GET /match/result/{match_id}/path 响应 data
      required: [match_id, learning_path]
      properties:
        match_id: { type: string }
        learning_path:
          type: array
          items: { $ref: '#/components/schemas/LearningPathItem' }
        learning_path_blocked:
          type: boolean
          default: false
          description: 学习路径是否因领域跨簇语义黑名单拦截（P1：跨域诱导组合拒绝生成）
        learning_path_block_reason:
          type: string
          nullable: true
          default: null
          description: 拦截原因（命中的岗位行业 × 候选人领域对），未拦截为 null

    GapAdvice:
      type: object
      description: 诊断报告差距建议项（evidence_id 可点击追溯）
      required: [skill, advice, evidence_id]
      properties:
        skill: { type: string }
        advice: { type: string }
        evidence_id: { type: string }

    DiagnosisReport:
      type: object
      description: LLM 人岗比对诊断报告（GET /match/result/{match_id}/diagnosis，§9.5）
      required: [overall_summary, radar_analysis, top_gaps, recommendations]
      properties:
        match_id: { type: string }
        overall_summary: { type: string, description: 总体匹配度解读 }
        radar_analysis: { type: string, description: 三维雷达图解读 }
        top_gaps:
          type: array
          items: { $ref: '#/components/schemas/GapAdvice' }
          description: 关键差距 Top-5 及改进建议
        path_analysis: { type: string, description: 学习路径解读 }
        recommendations:
          type: array
          items: { type: string }
          description: 整体改进建议清单

    # ============================================================
    # 图算法端点 data（08-14 契约补全：pagerank/skill-clusters/shortest-path）
    # ============================================================

    PagerankSkill:
      type: object
      description: PageRank 技能项（GET /graph/algorithms/pagerank）
      required: [id, name, score]
      properties:
        id: { type: string }
        name: { type: string }
        score: { type: number, description: PageRank 得分 }

    PagerankData:
      type: object
      description: GET /graph/algorithms/pagerank 响应 data
      required: [skills, top_n]
      properties:
        skills:
          type: array
          items: { $ref: '#/components/schemas/PagerankSkill' }
        top_n: { type: integer }

    ClusterSkill:
      type: object
      description: 技能簇成员项
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    ClusterLLM:
      type: object
      description: LLM 兜底命名结果（skill-clusters 响应）
      required: [coherent]
      properties:
        coherent: { type: boolean }
        cluster_name: { type: string, nullable: true }
        rationale: { type: string, nullable: true }
        splits:
          type: array
          items: { type: string }

    SkillCluster:
      type: object
      description: 技能簇项（GET /graph/algorithms/skill-clusters）
      required: [id, size, skills]
      properties:
        id: { type: integer }
        size: { type: integer }
        label: { type: string, description: 规则标签（簇内共现 Top-3 技能 · 拼接） }
        needs_llm: { type: boolean, description: 是否命中 LLM 兜底触发条件 }
        triggers:
          type: array
          items: { type: string }
          description: 触发原因（no_dominant_skill / cross_category / empty_label）
        llm: { $ref: '#/components/schemas/ClusterLLM', nullable: true }
        skills:
          type: array
          items: { $ref: '#/components/schemas/ClusterSkill' }

    ClusterLevel:
      type: object
      description: 层级元数据（阶段三层次化提取，0 = 最细）
      required: [level, cluster_count, modularity]
      properties:
        level: { type: integer }
        cluster_count: { type: integer }
        modularity: { type: number, description: 标准 Q（γ=1.0） }

    SkillClustersData:
      type: object
      description: GET /graph/algorithms/skill-clusters 响应 data
      required: [clusters, cluster_count]
      properties:
        clusters:
          type: array
          items: { $ref: '#/components/schemas/SkillCluster' }
        cluster_count: { type: integer }
        levels:
          type: array
          items: { $ref: '#/components/schemas/ClusterLevel' }
          nullable: true
          description: 层级元数据（Leiden 不支持层级时为 null）

    ShortestPathNode:
      type: object
      description: 最短路径节点（GET /graph/algorithms/shortest-path）
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }

    ShortestPathData:
      type: object
      description: GET /graph/algorithms/shortest-path 响应 data
      required: [from, to, path]
      properties:
        from: { type: string, description: 起点技能 ID }
        to: { type: string, description: 终点技能 ID }
        path:
          type: array
          items: { $ref: '#/components/schemas/ShortestPathNode' }
          description: 节点序列（≤6 跳，可能经过 Position）


    # ============================================================
    # 新岗位发现端点 data（08-27：/discovery/recent + /discovery/position-skills-delta）
    # ============================================================

    DiscoverySkill:
      type: object
      description: 岗位技能项（图谱 Position→REQUIRES→Skill）
      required: [skill_id, skill_name, necessity]
      properties:
        skill_id: { type: string }
        skill_name: { type: string }
        necessity: { type: string, description: must/nice/soft }
        weight: { type: number, nullable: true }
        level: { type: string, nullable: true }
        source_count: { type: integer, nullable: true }

    RecentDiscoveryCandidate:
      type: object
      description: 近期发现的新岗位候选（含技能；/discovery/recent）
      required: [position_name, state, detected_at]
      properties:
        position_id: { type: string, nullable: true, description: 图谱岗位 id；未落图时为 null }
        position_name: { type: string }
        state: { type: string, description: candidate/emerging/stable/declining }
        detected_at: { type: string, description: 发现时间（进入候选池） }
        definition_draft: { type: string }
        confidence:
          type: object
          additionalProperties: { type: number }
          nullable: true
        skills:
          type: object
          description: 图谱技能（must/nice/soft 分组）；candidate 未聚合时为 null
          nullable: true
          properties:
            must:
              type: array
              items: { $ref: '#/components/schemas/DiscoverySkill' }
            nice:
              type: array
              items: { $ref: '#/components/schemas/DiscoverySkill' }
            soft:
              type: array
              items: { $ref: '#/components/schemas/DiscoverySkill' }
        skill_pending: { type: boolean, description: 图内无该岗位技能（candidate 未聚合）时为 true 标注待审核 }

    DiscoveryRecentData:
      type: object
      description: GET /discovery/recent 响应 data
      required: [candidates, total]
      properties:
        candidates:
          type: array
          items: { $ref: '#/components/schemas/RecentDiscoveryCandidate' }
        total: { type: integer }

    PositionSkillsDelta:
      type: object
      description: 岗位技能增减项
      required: [skill_id, skill_name]
      properties:
        skill_id: { type: string }
        skill_name: { type: string }

    PositionSkillsDeltaData:
      type: object
      description: GET /discovery/position-skills-delta 响应 data
      required: [position_id, position_name, added, removed, unchanged]
      properties:
        position_id: { type: string }
        position_name: { type: string }
        from_version: { type: string, nullable: true, description: 对比基准版 id（较旧） }
        from_created_at: { type: string, nullable: true }
        to_version: { type: string, nullable: true, description: 目标版 id（较新） }
        to_created_at: { type: string, nullable: true }
        added:
          type: array
          items: { $ref: '#/components/schemas/PositionSkillsDelta' }
          description: 最近两版新增技能
        removed:
          type: array
          items: { $ref: '#/components/schemas/PositionSkillsDelta' }
          description: 最近两版移除技能
        unchanged:
          type: array
          items: { $ref: '#/components/schemas/PositionSkillsDelta' }
          description: 未变技能

    PositionSkillsDeltaVersion:
      type: object
      description: 可用快照版本（供对比版本选择）
      required: [id]
      properties:
        id: { type: string }
        created_at: { type: string, nullable: true }

    PositionSkillsDeltaSummaryItem:
      type: object
      description: 单岗位技能增减计数（两版快照对比）
      required: [position_id, position_name, added, removed, unchanged]
      properties:
        position_id: { type: string, description: 快照 REQUIRES 边 source（岗位 id） }
        position_name: { type: string }
        added: { type: integer, description: 新增技能数 }
        removed: { type: integer, description: 移除技能数 }
        unchanged: { type: integer, description: 未变技能数 }

    PositionSkillsDeltaSummaryData:
      type: object
      description: GET /discovery/position-skills-delta/summary 响应 data
      required: [positions, versions]
      properties:
        from_version: { type: string, nullable: true, description: 对比基准版 id（较旧） }
        from_created_at: { type: string, nullable: true }
        to_version: { type: string, nullable: true, description: 目标版 id（较新） }
        to_created_at: { type: string, nullable: true }
        versions:
          type: array
          description: 全部可用快照版本（created_at 降序）
          items: { $ref: '#/components/schemas/PositionSkillsDeltaVersion' }
        positions:
          type: array
          description: 全部岗位增减计数（增减数降序，其次名称）
          items: { $ref: '#/components/schemas/PositionSkillsDeltaSummaryItem' }
