openapi: 3.1.0
info:
  title: 智岗罗盘 API
  version: 1.0.0
  description: |
    多源异构驱动的岗位能力动态演化与人岗匹配系统 API 契约。
    本文件是前后端并行开发的单一事实源（AGENTS.md 铁律一）。
    前端通过 `openapi-typescript` 生成类型，不得自行定义与后端不一致的类型。
    认证方案：Bearer 双 Token（access 30min / refresh 7d）；refresh_token 同时
    写入 httpOnly Cookie（httponly + samesite=lax），供页面刷新后静默恢复会话。
    标注规则：全部端点已实现（M1-M4 全量交付），契约不含里程碑占位标注。
  contact:
    name: 智岗罗盘团队
    url: https://github.com/zhigang-compass

servers:
  - url: http://localhost:8000
    description: 开发环境
  - url: https://api.zhigang.example.com
    description: 生产环境

security:
  - BearerAuth: []

tags:
  - name: auth
    description: 认证模块
  - name: graph
    description: 图谱模块
  - name: resume
    description: 简历模块
  - name: match
    description: 匹配模块
  - name: evolution
    description: 演化模块
  - name: admin
    description: 管理模块

paths:
  # ============================================================
  # 认证模块 /api/v1/auth
  # ============================================================
  /api/v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录获取双 Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功，返回双 Token（Bearer 方案，前端内存持有）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    required: [access_token, refresh_token, token_type, expires_in]
                    properties:
                      access_token: { type: string }
                      refresh_token: { type: string }
                      token_type: { type: string }
                      expires_in: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      summary: 刷新 access_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      security: []
      summary: 登出，refresh_token 加入黑名单（body 传 refresh_token）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/auth/me:
    get:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      summary: 获取当前用户信息
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/User'

  /api/v1/auth/register:
    post:
      tags: [auth]
      security: []
      summary: 注册新用户（默认 guest 角色；管理员建号走 /admin/users）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================
  # 图谱模块 /api/v1/graph
  # ============================================================
  /api/v1/graph/position/{id}:
    get:
      tags: [graph]
      summary: 岗位节点详情"
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 岗位详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/graph/position/{id}/skills:
    get:
      tags: [graph]
      summary: 岗位技能列表"
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: necessity
          in: query
          schema: { type: string, enum: [must, nice] }
      responses:
        '200':
          description: 技能列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/graph/skill/{id}:
    get:
      tags: [graph]
      summary: 技能节点详情"
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 技能详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/graph/skill/{id}/evidence:
    get:
      tags: [graph]
      summary: 技能证据列表"
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 证据列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/graph/skill/{id}/prerequisites:
    get:
      tags: [graph]
      summary: 技能先修技能链（先修字典，拓扑序）
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 先修链（data 含 skill_id/skill_name/prerequisites[{skill_id,name,depth}]）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/graph/skill/{id}/courses:
    get:
      tags: [graph]
      summary: 学习课程列表（LEARNABLE_VIA + 质量分降序）
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 课程列表（data 含 skill_id/skill_name/courses[CourseRecommendation]）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/graph/skill/{id}/positions:
    get:
      tags: [graph]
      summary: 技能反向查询岗位
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 岗位列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/graph/skill/similar:
    get:
      tags: [graph]
      summary: 相似技能检索（pgvector）"
      parameters:
        - name: skill_id
          in: query
          required: true
          schema: { type: string }
        - name: top_k
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: 相似技能列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/graph/panorama:
    get:
      tags: [graph]
      summary: 全景视图（Neo4j 直接查询，无缓存）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 600 }
        - name: min_weight
          in: query
          schema: { type: number, default: 0.3, minimum: 0, maximum: 1 }
        - name: focus
          in: query
          schema: { type: string }
          description: 以某岗位为中心展开
      responses:
        '200':
          description: 全景图数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    properties:
                      nodes: { type: array, items: { type: object } }
                      edges: { type: array, items: { type: object } }
                      stats: { type: object }

  /api/v1/graph/algorithms/pagerank:
    get:
      tags: [graph]
      summary: PageRank 技能重要性 Top-N（纯 Python，Neo4j 社区版无 GDS）
      parameters:
        - name: top_n
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: min_weight
          in: query
          schema: { type: number, default: 1.0, minimum: 1.0 }
          description: 共现边权重下限（共现岗位数）
      responses:
        '200':
          description: 技能重要性排名
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    properties:
                      skills:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            score: { type: number }
                      top_n: { type: integer }

  /api/v1/graph/algorithms/skill-clusters:
    get:
      tags: [graph]
      summary: Louvain 技能簇识别（纯 Python）
      parameters:
        - name: min_size
          in: query
          schema: { type: integer, default: 2, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: 技能簇列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    properties:
                      clusters:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            size: { type: integer }
                            skills:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: string }
                                  name: { type: string }
                      cluster_count: { type: integer }

  /api/v1/graph/algorithms/shortest-path:
    get:
      tags: [graph]
      summary: 技能最短路径（shortestPath((:Skill)-[*..6]-(:Skill))）
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
          description: 起点技能 ID
        - name: to
          in: query
          required: true
          schema: { type: string }
          description: 终点技能 ID
      responses:
        '200':
          description: 最短路径节点序列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    properties:
                      from: { type: string }
                      to: { type: string }
                      path:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            type: { type: string }
        '404':
          description: 两技能间不存在 ≤6 跳可达路径

  /api/v1/graph/view/{view_type}:
    get:
      tags: [graph]
      summary: 视图切换（后端过滤）"
      parameters:
        - name: view_type
          in: path
          required: true
          schema: { type: string, enum: [panorama, techStack, level, positionCenter] }
      responses:
        '200':
          description: 视图数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/graph/search:
    get:
      tags: [graph]
      summary: 图谱搜索（Neo4j 全文索引）
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [position, skill, evidence] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================
  # 简历模块 /api/v1/resume
  # ============================================================
  /api/v1/resume/list:
    get:
      tags: [resume]
      summary: 已解析简历列表（最近 N 条，按更新时间倒序）
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 简历缓存列表（含候选人画像摘要）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/resume/parse:
    post:
      tags: [resume]
      summary: 上传简历触发解析（异步，含 PII 脱敏预处理）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: 已接受，异步处理中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    properties:
                      task_id: { type: string }

  /api/v1/resume/task/{task_id}:
    get:
      tags: [resume]
      summary: 查询解析任务状态
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/resume/task/{task_id}/stream:
    get:
      tags: [resume]
      summary: "SSE 推送任务进度（event: progress/done/error）"
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/resume/files/{resume_id}/download:
    get:
      tags: [resume]
      summary: 下载简历原始文件（仅上传者本人可下载，admin 无权访问原文）
      parameters:
        - name: resume_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 原始文件字节流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: resume_id 格式非法
        '403':
          description: 非本人无权下载
        '404':
          description: 简历文件不存在

  /api/v1/resume/{resume_id}:
    get:
      tags: [resume]
      summary: 获取解析结果
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 简历数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags: [resume]
      summary: 编辑简历信息
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags: [resume]
      summary: 删除简历
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: 删除成功

  # ============================================================
  # 匹配模块 /api/v1/match
  # ============================================================
  /api/v1/match/recommend:
    post:
      tags: [match]
      summary: 自动推荐 Top-N（同步返回，含 CII 通胀修正）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_id]
              properties:
                resume_id: { type: string }
                top_n: { type: integer, default: 10, maximum: 50 }
      responses:
        '200':
          description: 推荐结果列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/match/compare:
    post:
      tags: [match]
      summary: 人岗比对（含差距三态 + 学习路径）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_id, position_id]
              properties:
                resume_id: { type: string }
                position_id: { type: string }
      responses:
        '200':
          description: |
            匹配结果 + gaps（GapSkill[]，三态）+ learning_path
            （LearningPathItem[]，missing/weak 技能先修链 + 课程 Top-3）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/match/task/{task_id}:
    get:
      tags: [match]
      summary: 查询推荐任务状态"
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/match/result/{match_id}:
    get:
      tags: [match]
      summary: 获取匹配结果"
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 匹配详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/match/result/{match_id}/gap:
    get:
      tags: [match]
      summary: 获取差距分析"
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 差距列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/match/result/{match_id}/path:
    get:
      tags: [match]
      summary: 获取学习路径"
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 学习路径
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/match/result/{match_id}/diagnosis:
    get:
      tags: [match]
      summary: 获取人岗比对诊断报告"
      description: LLM 基于结果快照（分数/差距/学习路径/证据）生成结构化诊断报告，结果缓存 24h
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 诊断报告（overall_summary / radar_analysis / top_gaps / path_analysis / recommendations）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 该匹配结果无差距数据（仅人岗比对可生成诊断报告）
        '404':
          description: 匹配结果不存在或已过期
        '503':
          description: 诊断报告生成失败（LLM 不可用或超时）

  /api/v1/match/feedback:
    post:
      tags: [match]
      summary: 提交匹配反馈"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [match_id, score]
              properties:
                match_id: { type: string }
                score: { type: integer, enum: [1, -1], description: "1=👍, -1=👎" }
      responses:
        '200':
          description: 反馈已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================
  # 演化模块 /api/v1/evolution
  # ============================================================
  /api/v1/evolution/versions:
    get:
      tags: [evolution]
      summary: 获取图谱版本列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/evolution/versions/{version_id}:
    get:
      tags: [evolution]
      summary: 获取版本详情"
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 版本详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/evolution/diff:
    get:
      tags: [evolution]
      summary: 版本对比
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 差异
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/evolution/trends:
    get:
      tags: [evolution]
      summary: 技能趋势查询
      parameters:
        - name: skill
          in: query
          required: true
          schema: { type: string }
        - name: window
          in: query
          schema: { type: integer, default: 90, description: "天数" }
      responses:
        '200':
          description: 趋势数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/evolution/position/{id}/evolution:
    get:
      tags: [evolution]
      summary: 岗位演化历史"
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 演化历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/evolution/state-machine:
    get:
      tags: [evolution]
      summary: 岗位状态机总览（六态分布 + 最近人工流转记录）"
      responses:
        '200':
          description: 状态机总览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/evolution/signals:
    get:
      tags: [evolution]
      summary: 新兴/衰退技能 Top-N（快照序列 Z-score 信号）
      parameters:
        - name: top_n
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: 信号列表（data 含 window_count/emerging/declining）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/evolution/watch:
    get:
      tags: [evolution]
      summary: 观察池公开摘要 + MLI 产业化拐点排名（前端看板）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: 观察池摘要（data 含 items/total，item 含 mli/ready_to_industrialize）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================
  # 管理模块 /api/v1/admin
  # ============================================================
  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: 用户列表（admin only）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [admin]
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                role: { type: string, enum: [admin, user, guest] }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/users/{id}:
    put:
      tags: [admin]
      summary: 更新用户
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, user, guest] }
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags: [admin]
      summary: 禁用用户
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: 禁用成功

  /api/v1/admin/crawl/trigger:
    post:
      tags: [admin]
      summary: 触发爬取任务（平台白名单校验 + ARQ 入队）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, keyword]
              properties:
                platform: { type: string, description: "平台 ID：boss/zhilian/monster/indeed/glassdoor/linkedin/maimai/github/stackoverflow/arxiv/icourse163/coursera/edx" }
                keyword: { type: string }
      responses:
        '202':
          description: 任务已触发（data 含 task_id/status=pending）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/crawl/status:
    get:
      tags: [admin]
      summary: 爬取状态监控
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/crawl/history:
    get:
      tags: [admin]
      summary: 爬取历史（task_status 中 crawl 任务，倒序分页）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 爬取历史列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/crawl/task/{task_id}/stream:
    get:
      tags: [admin]
      summary: "爬虫实时日志 SSE（event: log/progress/done/error）"
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/admin/llm-config:
    get:
      tags: [admin]
      summary: 读取 LLM provider 配置（api_key 打码，admin only）
      responses:
        '200':
          description: 当前生效配置（providers/routing/failover 等，api_key 已打码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags: [admin]
      summary: 保存 LLM provider 配置（持久化到 llm_providers.yaml）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providers]
              properties:
                providers:
                  type: array
                  description: provider 列表，api_key 留空或 **** 表示保持原值
                  items:
                    type: object
                    required: [name, base_url, model, priority, enabled]
                    properties:
                      name: { type: string, description: provider 标识（英文短横线） }
                      base_url: { type: string, format: uri }
                      api_key: { type: string, description: "留空或 **** 表示保持原值；明文才更新" }
                      model: { type: string }
                      priority: { type: integer, minimum: 1, description: 数字越小优先级越高，列表内唯一 }
                      enabled: { type: boolean }
                      supports_function_calling: { type: boolean }
      responses:
        '200':
          description: 保存成功，返回打码后的最新配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/positions/{position_name}:
    get:
      tags: [admin]
      summary: 岗位详情（人工编辑前查看技能/学历/证书与文本定义）
      parameters:
        - name: position_name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 岗位详情（skills 列表 + core_duties/scenarios + education/certifications）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: 岗位不存在
    put:
      tags: [admin]
      summary: 人工编辑岗位定义（技能增删/necessity 切换/weight 调整/文本修改），变更写入 PositionEditLog 节点
      parameters:
        - name: position_name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skills:
                  type: array
                  description: 技能全量替换（缺省不变更），每项含 name/necessity/weight
                  items:
                    type: object
                    required: [name, necessity, weight]
                    properties:
                      name: { type: string, description: 技能名 }
                      necessity: { type: string, enum: [must, nice] }
                      weight: { type: number, minimum: 0.0, maximum: 1.0 }
                core_duties:
                  type: array
                  description: 核心职责（字符串数组，全量替换）
                  items: { type: string }
                scenarios:
                  type: array
                  description: 典型场景（字符串数组，全量替换）
                  items: { type: string }
      responses:
        '200':
          description: 保存结果（updated/diff_summary）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 参数不合法（weight 越界 / necessity 非法等）
        '404':
          description: 岗位不存在

  /api/v1/admin/positions/pending:
    get:
      tags: [admin]
      summary: 待审核岗位列表
      responses:
        '200':
          description: 待审核列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/positions/{id}/review:
    post:
      tags: [admin]
      summary: 审核岗位（批准/驳回）"
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [approve, reject] }
                reason: { type: string, description: "审核理由（必填）" }
      responses:
        '200':
          description: 审核完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 参数不合法 / 不满足晋升条件
        '404':
          description: 候选岗位不存在
        '409':
          description: 候选岗位当前状态不可审核

  /api/v1/admin/positions/declining:
    get:
      tags: [admin]
      summary: 待归档岗位列表（declining 状态）"
      responses:
        '200':
          description: 待归档列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/positions/{id}/archive:
    put:
      tags: [admin]
      summary: 确认衰退归档（declining → archived 终态）"
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: "归档原因（必填，写入审计日志）" }
      responses:
        '200':
          description: 归档完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/evolution/pending:
    get:
      tags: [admin]
      summary: 待审核演化变更"
      responses:
        '200':
          description: 待审核列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/discovery/watch:
    get:
      tags: [admin]
      summary: 技术热点观察池周报（§7.2.5，admin 可见，供运营周报/审核）
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [watch, candidate_promoted, archived] }
          description: 状态过滤
        - name: source
          in: query
          schema: { type: string }
          description: 信号源过滤（jd/arxiv/course/github/stackoverflow）
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: 观察池信号分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            skill_name: { type: string }
                            signal_source: { type: string }
                            signal_value: { type: number }
                            period: { type: string }
                            status: { type: string }
                            first_seen_at: { type: string, nullable: true }
                            last_signal_at: { type: string, nullable: true }
                      total: { type: integer }
                      page: { type: integer }
                      size: { type: integer }

  /api/v1/admin/evolution/{id}/review:
    put:
      tags: [admin]
      summary: 审核演化变更"
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                modified: { type: object }
      responses:
        '200':
          description: 审核完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/audit/logs:
    get:
      tags: [admin]
      summary: 审计日志查询
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [AUTH, GRAPH, DATA, ADMIN] }
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 日志列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    RateLimited:
      description: 请求限流
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'

  schemas:
    ApiResponse:
      type: object
      required: [code, msg, trace_id]
      properties:
        code:
          type: integer
          description: "0=成功，非 0=错误码（见设计文档 §2.4.7）"
        msg:
          type: string
        data:
          description: 业务数据（成功时存在）
        trace_id:
          type: string
          description: 链路追踪 ID（uuid4 hex 截断 16 位）

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, user, guest] }
        permissions: { type: array, items: { type: string } }

    GapSkill:
      type: object
      description: 技能差距项（设计文档 §9.5 三态）
      properties:
        skill: { type: string, description: 技能名 }
        skill_id: { type: string, nullable: true, description: 图谱技能 ID }
        necessity: { type: string, enum: [must, nice] }
        gap_type: { type: string, enum: [missing, weak, matched] }
        weight: { type: number, description: 技能权重 }
        priority: { type: string, enum: [high, medium, low] }
        current_proficiency: { type: string, nullable: true, description: 候选人当前熟练度 }
        required_proficiency: { type: string, nullable: true, description: 岗位期望熟练度 }

    CourseRecommendation:
      type: object
      description: 学习课程推荐（质量分 Top-3，设计文档 §4.6）
      properties:
        course_id: { type: string, description: 图谱 Course ID }
        title: { type: string }
        platform: { type: string }
        quality_score: { type: number, nullable: true, minimum: 0, maximum: 1 }
        recommended: { type: boolean }
        source_url: { type: string }
        hours: { type: number, nullable: true, description: 课程时长（小时） }

    LearningPathItem:
      type: object
      description: 单技能学习路径项（甘特图格式，设计文档 §9.5）
      properties:
        skill: { type: string, description: 目标技能名 }
        skill_id: { type: string, nullable: true }
        prerequisites: { type: array, items: { type: string }, description: 先修技能链（先修在前） }
        courses: { type: array, items: { $ref: '#/components/schemas/CourseRecommendation' } }
        estimated_hours: { type: number, description: 预计学习学时 }
        priority: { type: string, enum: [high, medium, low] }
