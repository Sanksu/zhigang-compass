      tags: [discovery]
      summary: 近期发现的新岗位及其技能（登录可见）
      description: 读 discovery_candidates（按 detected_at 降序近 N 天），回查图谱 Position→REQUIRES→Skill 取技能清单；candidate 态尚未聚合时 skills=null + skill_pending=true 标注待审核
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
          description: 近 N 天候选窗口
        - name: state
          in: query
          required: false
          schema: { type: string }
          description: 按状态过滤（candidate/emerging/stable/declining），缺省不过滤
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 返回条数上限
      responses:
        '200':
          description: 近 N 天新岗位候选列表（data 含 candidates/total）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    $ref: '#/components/schemas/DiscoveryRecentData'
                  trace_id: { type: string }
