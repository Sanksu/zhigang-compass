# 新兴岗位种子列表（设计文档 7.2.3 节）
# 预置 12 个新兴岗位种子，参考 talent-graph-system 的 EMERGING_SEEDS 模式。
# candidate 命中种子列表时生成岗位定义草案进入 admin 审核队列。
# 运营可通过追加条目扩展。

seeds:
