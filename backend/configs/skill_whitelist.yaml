# 标准技能白名单（设计文档 §6.3 第三道防线：500+ 标准技能）
#
# 单一事实源：SKILL_WHITELIST 由本文件加载（dictionary.py 启动时读取）。
# 结构：skills 列表，每项 {name, category}，category 与 schema.cypher 的
# `skill.category` 索引对应。
#
# 扩充机制（不靠手写硬编码）：
#   python scripts/expand_skill_whitelist.py --top 500
# 从 jd_raw 结构化抽取结果挖掘白名单外高频技能 → 人工审核 → 追加本文件。
#
# 约定：
# - 技能名采用图谱归一化后的规范名（normalize_skill 口径一致）
# - 软技能子集（SOFT_SKILL_WHITELIST 20 项）必须包含在本清单内
# - 新增条目建议注明 category，便于分类检索

