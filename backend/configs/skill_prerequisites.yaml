# 技能先修字典（AL-M4-03 学习路径先修链单一事实源）
#
# 图谱当前无 PREREQUISITE_OF 先修关系边，先修链以人工维护字典兜底
# （与设计文档 §5.3 "层次聚类 + 人工词典兜底" 哲学一致）。
#
# 结构：
#   default_hours_per_skill: 技能基础学时（小时），估算 estimated_hours 用
#   skills:
#     技能名:
#       prerequisites: [先修技能名, ...]   # 先修链递归展开，先修在前（拓扑序）
#       hours: 80                          # 可选：覆盖基础学时
#
# 约定：
# - 技能名采用图谱归一化后的规范名（与 SKILL_WHITELIST / normalize_skill 口径一致）
# - 先修链深度 ≤ 3，避免链条过深导致路径失真
# - 未知技能的 estimated_hours 使用 default_hours_per_skill

default_hours_per_skill: 30

